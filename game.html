// --- Boss Shockwave Rendering ---
function drawBossShockwaves() {
  for (const sw of bossShockwaves) {
    const alpha = sw.life / sw.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha * 0.7;
    ctx.strokeStyle = '#ff4400';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
    ctx.stroke();
    // Inner glow
    ctx.strokeStyle = '#ffaa44';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// --- Boss Fireball Rendering ---
function drawBossFireballs() {
  for (const fb of bossFireballs) {
    ctx.save();
    const angle = Math.atan2(fb.vy, fb.vx);
    ctx.translate(fb.x, fb.y);
    ctx.rotate(angle);
    // Glow
    const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, fb.radius * 2);
    grd.addColorStop(0, 'rgba(255,100,0,0.5)');
    grd.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0, fb.radius * 2, 0, Math.PI*2); ctx.fill();
    // Core
    ctx.fillStyle = '#ffcc44';
    ctx.beginPath(); ctx.arc(0, 0, fb.radius * 0.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff6622';
    ctx.beginPath(); ctx.arc(0, 0, fb.radius, 0, Math.PI*2); ctx.fill();
    // Trail
    ctx.fillStyle = 'rgba(255,80,0,0.4)';
    ctx.beginPath();
    ctx.moveTo(-fb.radius, -fb.radius*0.5);
    ctx.lineTo(-fb.radius*3, 0);
    ctx.lineTo(-fb.radius, fb.radius*0.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

// --- Boss Portal Rendering ---
function drawBossPortal() {
  if (!bossPortal) return;
  const p = bossPortal;
  const pct = p.life / p.maxLife; // 1.0 → 0.0 as portal fades
  const t = performance.now() / 1000;
  const alpha = pct < 0.3 ? pct / 0.3 : (pct > 0.7 ? 1.0 : 1.0); // fade out at end
  const openPct = Math.min(1, (1 - pct) / 0.3); // opens during first 30%
  const portalRadius = 180 * openPct;

  ctx.save();
  ctx.globalAlpha = alpha;

  // Outer glow ring
  for (let ring = 3; ring >= 0; ring--) {
    const r = portalRadius + ring * 25;
    const grad = ctx.createRadialGradient(p.x, p.y, r * 0.7, p.x, p.y, r);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.5, `rgba(${150+ring*30},${20+ring*10},${200+ring*15},${0.15 * alpha})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
  }

  // Swirling portal vortex
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + t * (2 + i * 0.3);
    const armLen = portalRadius * 0.9;
    ctx.strokeStyle = `rgba(${180+i*10},${30+i*8},${220},${0.5 * alpha})`;
    ctx.lineWidth = 6 - i * 0.4;
    ctx.beginPath();
    for (let j = 0; j <= 30; j++) {
      const frac = j / 30;
      const spiralAngle = angle + frac * Math.PI * 1.5;
      const r = frac * armLen;
      const sx = p.x + Math.cos(spiralAngle) * r;
      const sy = p.y + Math.sin(spiralAngle) * r;
      if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }

  // Inner dark void
  const innerGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, portalRadius * 0.6);
  innerGrad.addColorStop(0, `rgba(0,0,0,${0.9 * alpha})`);
  innerGrad.addColorStop(0.6, `rgba(30,0,40,${0.7 * alpha})`);
  innerGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = innerGrad;
  ctx.beginPath(); ctx.arc(p.x, p.y, portalRadius * 0.6, 0, Math.PI * 2); ctx.fill();

  // Glowing rim
  ctx.strokeStyle = `rgba(255,${80+Math.sin(t*8)*40},${200+Math.sin(t*6)*55},${0.8 * alpha})`;
  ctx.lineWidth = 4 + Math.sin(t * 10) * 2;
  ctx.beginPath(); ctx.arc(p.x, p.y, portalRadius, 0, Math.PI * 2); ctx.stroke();

  // Fire/energy particles shooting out
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + t * 3;
    const dist = portalRadius + Math.sin(t * 5 + i) * 20;
    const px = p.x + Math.cos(a) * dist;
    const py = p.y + Math.sin(a) * dist;
    const s = 3 + Math.sin(t * 8 + i * 2) * 2;
    ctx.fillStyle = `rgba(255,${100 + i*12},${50},${0.6 * alpha})`;
    ctx.beginPath(); ctx.arc(px, py, s, 0, Math.PI * 2); ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Boss Teleport AOE Rendering ---
function drawBossTeleportAOEs() {
  for (const aoe of bossTeleportAOEs) {
    const pct = aoe.life / aoe.maxLife;
    const t = performance.now() / 1000;
    const expandPct = Math.min(1, (1 - pct) / 0.3); // expands quickly
    const currentRadius = aoe.radius * expandPct;

    ctx.save();
    ctx.globalAlpha = pct;

    // Outer fire ring
    const grad = ctx.createRadialGradient(aoe.x, aoe.y, currentRadius * 0.3, aoe.x, aoe.y, currentRadius);
    grad.addColorStop(0, `rgba(255,200,50,${0.6 * pct})`);
    grad.addColorStop(0.4, `rgba(255,100,0,${0.5 * pct})`);
    grad.addColorStop(0.7, `rgba(200,30,0,${0.3 * pct})`);
    grad.addColorStop(1, 'rgba(100,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(aoe.x, aoe.y, currentRadius, 0, Math.PI * 2); ctx.fill();

    // Fire tendrils shooting outward
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2 + t * 2;
      const tendrilLen = currentRadius * (0.7 + Math.sin(t * 6 + i * 3) * 0.3);
      ctx.strokeStyle = `rgba(255,${150+Math.sin(t*4+i)*80},0,${0.5 * pct})`;
      ctx.lineWidth = 3 + Math.sin(t * 8 + i) * 2;
      ctx.beginPath();
      ctx.moveTo(aoe.x + Math.cos(a) * currentRadius * 0.2, aoe.y + Math.sin(a) * currentRadius * 0.2);
      ctx.lineTo(aoe.x + Math.cos(a) * tendrilLen, aoe.y + Math.sin(a) * tendrilLen);
      ctx.stroke();
    }

    // Bright center flash
    const centerGrad = ctx.createRadialGradient(aoe.x, aoe.y, 0, aoe.x, aoe.y, currentRadius * 0.3);
    centerGrad.addColorStop(0, `rgba(255,255,200,${0.8 * pct})`);
    centerGrad.addColorStop(1, 'rgba(255,200,50,0)');
    ctx.fillStyle = centerGrad;
    ctx.beginPath(); ctx.arc(aoe.x, aoe.y, currentRadius * 0.3, 0, Math.PI * 2); ctx.fill();

    // Warning ring outline
    ctx.strokeStyle = `rgba(255,50,0,${0.7 * pct})`;
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.arc(aoe.x, aoe.y, aoe.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);

    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// --- Weather Draw Functions ---
function drawLightningWarnings() {
  const time = performance.now() / 1000;
  for (const w of lightningWarnings) {
    const progress = 1 - w.timer / w.maxTimer;
    const flickerSpeed = 5 + progress * 20;
    const flickerBase = 0.15 + progress * 0.6;
    const flicker = flickerBase + Math.sin(time * flickerSpeed) * 0.225 * (1 + progress);
    const alpha = Math.max(0, Math.min(1, flicker));
    ctx.save();
    ctx.globalAlpha = alpha;
    // Warning glow on ground
    const grd = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.radius);
    grd.addColorStop(0, 'rgba(255,255,200,0.55)');
    grd.addColorStop(0.4, 'rgba(200,210,255,0.3)');
    grd.addColorStop(0.7, 'rgba(150,180,255,0.15)');
    grd.addColorStop(1, 'rgba(100,150,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2); ctx.fill();
    // Dashed warning ring
    ctx.strokeStyle = `rgba(180,200,255,${alpha * 0.6})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    // Inner bright spot when close to striking
    if (progress > 0.6) {
      const inner = (progress - 0.6) / 0.4 * flicker;
      ctx.globalAlpha = inner;
      // Electric sparks
      for (let s = 0; s < 5; s++) {
        const a = time * 8 + s * Math.PI * 2 / 5;
        const dist = w.radius * (0.2 + Math.sin(time * 12 + s) * 0.15);
        const sx = w.x + Math.cos(a) * dist;
        const sy = w.y + Math.sin(a) * dist;
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.arc(sx, sy, 2 + Math.random() * 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = inner * 0.5;
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.arc(w.x, w.y, w.radius * 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

function drawRain() {
  ctx.save();
  ctx.lineCap = 'round';
  for (const drop of rainDrops) {
    ctx.globalAlpha = drop.alpha;
    ctx.strokeStyle = '#aabbdd';
    ctx.lineWidth = 1.5;
    const dx = (RAIN_SPEED_X / RAIN_SPEED_Y) * drop.len;
    ctx.beginPath();
    ctx.moveTo(drop.x, drop.y);
    ctx.lineTo(drop.x + dx, drop.y + drop.len);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawLightningStrikes() {
  for (const s of lightningStrikes) {
    const t = 1 - s.life / s.maxLife;
    const alpha = Math.max(0, 1 - t * 1.5);
    ctx.save();
    ctx.globalAlpha = alpha;
    // Ground impact glow
    const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.radius * 1.5);
    grd.addColorStop(0, 'rgba(255,255,255,0.9)');
    grd.addColorStop(0.2, 'rgba(200,220,255,0.5)');
    grd.addColorStop(0.6, 'rgba(100,150,255,0.15)');
    grd.addColorStop(1, 'rgba(80,120,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.radius * 1.5, 0, Math.PI * 2); ctx.fill();
    // Multiple bolts
    if (s.bolts) {
      for (const bolt of s.bolts) {
        if (!bolt || bolt.length < 2) continue;
        // Wide outer glow
        ctx.strokeStyle = `rgba(100,140,255,${alpha * 0.2})`;
        ctx.lineWidth = 22; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(bolt[0].x, bolt[0].y);
        for (let i = 1; i < bolt.length; i++) ctx.lineTo(bolt[i].x, bolt[i].y);
        ctx.stroke();
        // Mid glow
        ctx.strokeStyle = `rgba(150,180,255,${alpha * 0.5})`;
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(bolt[0].x, bolt[0].y);
        for (let i = 1; i < bolt.length; i++) ctx.lineTo(bolt[i].x, bolt[i].y);
        ctx.stroke();
        // Bright core
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(bolt[0].x, bolt[0].y);
        for (let i = 1; i < bolt.length; i++) ctx.lineTo(bolt[i].x, bolt[i].y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  // Lightning fire pools
  for (const f of lightningFires) {
    const t = 1 - f.life / f.maxLife;
    const fadeOut = f.life < 1.5 ? f.life / 1.5 : 1;
    const fadeIn = Math.min(1, (f.maxLife - f.life) / 0.3);
    const baseAlpha = Math.min(fadeIn, fadeOut) * 0.7;
    ctx.save();
    ctx.globalAlpha = baseAlpha;
    // Fire pool gradient
    const grd = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
    grd.addColorStop(0, 'rgba(255,200,50,0.6)');
    grd.addColorStop(0.3, 'rgba(255,120,20,0.45)');
    grd.addColorStop(0.6, 'rgba(200,50,0,0.25)');
    grd.addColorStop(0.85, 'rgba(120,20,0,0.1)');
    grd.addColorStop(1, 'rgba(80,10,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill();
    // Flickering fire tendrils
    const time = performance.now() / 1000;
    for (let j = 0; j < 8; j++) {
      const a = (j / 8) * Math.PI * 2 + time * 1.2 + Math.sin(time * 3 + j) * 0.5;
      const dist = f.radius * (0.35 + Math.sin(time * 4 + j * 1.7) * 0.2);
      const tx = f.x + Math.cos(a) * dist;
      const ty = f.y + Math.sin(a) * dist;
      const tr = f.radius * 0.3;
      const tg = ctx.createRadialGradient(tx, ty, 0, tx, ty, tr);
      tg.addColorStop(0, 'rgba(255,180,40,0.5)');
      tg.addColorStop(0.5, 'rgba(255,80,0,0.2)');
      tg.addColorStop(1, 'rgba(180,30,0,0)');
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.arc(tx, ty, tr, 0, Math.PI * 2); ctx.fill();
    }
    // Rising ember particles (visual only)
    for (let e = 0; e < 3; e++) {
      const ea = Math.random() * Math.PI * 2;
      const ed = Math.random() * f.radius * 0.8;
      const ex = f.x + Math.cos(ea) * ed;
      const ey = f.y + Math.sin(ea) * ed - Math.random() * 15;
      ctx.globalAlpha = baseAlpha * (0.4 + Math.random() * 0.4);
      ctx.fillStyle = Math.random() > 0.5 ? '#ffaa22' : '#ff6600';
      ctx.beginPath(); ctx.arc(ex, ey, 1.5 + Math.random() * 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  // Screen flash overlay
  if (screenFlash > 0) {
    ctx.save();
    ctx.globalAlpha = screenFlash * 0.3;
    ctx.fillStyle = '#ccdeff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// --- Boss Entrance Overlay ---
function drawBossEntrance() {
  if (bossEntranceTimer <= 0) return;
  const alpha = Math.min(1, bossEntranceTimer / 2.5);
  ctx.save();
  // Dark sky overlay
  ctx.fillStyle = `rgba(10,0,0,${alpha * 0.6})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Lightning flashes
  if (Math.random() < 0.1) {
    ctx.fillStyle = `rgba(255,200,150,${0.3 * alpha})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  // Draw the portal behind text
  drawBossPortal();
  // Text
  ctx.fillStyle = `rgba(255,${Math.floor(50 + Math.sin(performance.now()/100)*30)},0,${alpha})`;
  ctx.font = 'bold 72px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('THE DEMON LORD', canvas.width/2, canvas.height/2 - 160);
  ctx.fillStyle = `rgba(255,150,100,${alpha * 0.8})`;
  ctx.font = 'bold 32px monospace';
  ctx.fillText('EMERGES FROM THE ABYSS', canvas.width/2, canvas.height/2 - 110);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Mini-Demon Lord HP Bar ---
function drawMiniDemonLordHPBar() {
  if (!miniDemonLord || miniDemonLord.hp <= 0) return;
  const cx = canvas.width / 2;
  const barW = 500, barH = 16, barY = finalBoss ? 110 : 80;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(cx - barW/2 - 4, barY - 4, barW + 8, barH + 8);
  ctx.fillStyle = '#110033';
  ctx.fillRect(cx - barW/2, barY, barW, barH);
  const hpPct = miniDemonLord.hp / miniDemonLord.maxHp;
  const barColor = miniDemonLordPhase === 2 ? '#ff22ff' : '#9922ff';
  ctx.fillStyle = barColor;
  ctx.fillRect(cx - barW/2, barY, barW * hpPct, barH);
  ctx.strokeStyle = miniDemonLordPhase === 2 ? '#ff66ff' : '#bb44ff';
  ctx.lineWidth = 2;
  ctx.strokeRect(cx - barW/2, barY, barW, barH);
  ctx.fillStyle = miniDemonLordPhase === 2 ? '#ff88ff' : '#cc66ff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  const phaseLabel = miniDemonLordPhase === 2 ? '  [ENRAGED]' : '';
  ctx.fillText(`MINI-DEMON LORD  ${miniDemonLord.hp}/${miniDemonLord.maxHp}${phaseLabel}`, cx, barY - 6);
  ctx.restore();
}

// --- Mini-Demon Lord Entrance Overlay ---
function drawMiniDemonLordEntrance() {
  if (miniDemonLordEntranceTimer <= 0) return;
  const alpha = Math.min(1, miniDemonLordEntranceTimer / 2.5);
  ctx.save();
  ctx.fillStyle = `rgba(20,0,40,${alpha * 0.6})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (Math.random() < 0.1) {
    ctx.fillStyle = `rgba(180,100,255,${0.3 * alpha})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  drawBossPortal();
  ctx.fillStyle = `rgba(200,${Math.floor(50 + Math.sin(performance.now()/100)*30)},255,${alpha})`;
  ctx.font = 'bold 64px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('THE MINI-DEMON LORD', canvas.width/2, canvas.height/2 - 160);
  ctx.fillStyle = `rgba(180,120,255,${alpha * 0.8})`;
  ctx.font = 'bold 28px monospace';
  ctx.fillText('RISES FROM THE SHADOWS', canvas.width/2, canvas.height/2 - 110);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Mini-Demon Lord Death Explosion (celebratory pinata burst) ---
function drawMiniDemonLordExplosion() {
  if (!miniDemonLordExplosion) return;
  const e = miniDemonLordExplosion;
  const progress = 1 - e.life / e.maxLife;
  const expandRadius = e.radius * Math.min(1, progress * 1.5);
  const alpha = e.life / e.maxLife;
  ctx.save();
  // Expanding colorful shockwave (celebratory, not deadly)
  const grd = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, expandRadius);
  grd.addColorStop(0, `rgba(255,255,200,${alpha * 0.6})`);
  grd.addColorStop(0.2, `rgba(255,200,50,${alpha * 0.4})`);
  grd.addColorStop(0.5, `rgba(255,100,200,${alpha * 0.25})`);
  grd.addColorStop(0.8, `rgba(100,200,255,${alpha * 0.15})`);
  grd.addColorStop(1, `rgba(50,50,100,0)`);
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(e.x, e.y, expandRadius, 0, Math.PI * 2);
  ctx.fill();
  // Bright ring at edge
  ctx.strokeStyle = `rgba(255,220,100,${alpha * 0.7})`;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(e.x, e.y, expandRadius * 0.95, 0, Math.PI * 2);
  ctx.stroke();
  // Confetti-like sparkle particles in the expanding ring
  const time = performance.now() * 0.001;
  const confettiColors = ['#ff4488','#44ddff','#ffdd22','#44ff88','#ff8844','#aa66ff'];
  for (let c = 0; c < 20; c++) {
    const ca = (c / 20) * Math.PI * 2 + time * 2;
    const cr = expandRadius * (0.7 + Math.sin(c * 3 + time * 5) * 0.25);
    const cx2 = e.x + Math.cos(ca) * cr;
    const cy2 = e.y + Math.sin(ca) * cr;
    ctx.fillStyle = confettiColors[c % confettiColors.length];
    ctx.globalAlpha = alpha * 0.8;
    ctx.fillRect(cx2 - 3, cy2 - 3, 6, 6);
  }
  ctx.globalAlpha = 1;
  // Screen flash
  ctx.fillStyle = `rgba(255,240,200,${alpha * 0.15})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
}

// ========================================
// UI SCREENS (Menu, Pause, GameOver, Victory, Name Entry, Leaderboard)
// ========================================
// --- Game Over Screen (enhanced with stats) ---
function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2, cy = canvas.height / 2;
  ctx.fillStyle = '#ff3333'; ctx.font = 'bold 52px monospace'; ctx.textAlign = 'center';
  ctx.fillText('You Died', cx, cy - 80);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 24px monospace';
  ctx.fillText(`Kills: ${kills}`, cx, cy - 40);
  if (activeDifficulty) {
    ctx.fillStyle = activeDifficulty.color; ctx.font = 'bold 18px monospace';
    ctx.fillText(`Difficulty: ${activeDifficulty.label}`, cx, cy - 10);
  }
  // Detailed stats
  const elapsed = Math.floor((performance.now() - gameStartTime) / 1000);
  const mins = Math.floor(elapsed / 60), secs = elapsed % 60;
  ctx.fillStyle = '#aaa'; ctx.font = '16px monospace';
  ctx.fillText(`Survived: ${mins}m ${secs}s  |  Level: ${playerLevel}  |  Best Combo: ${statMaxCombo}x`, cx, cy + 20);
  ctx.fillText(`Damage Taken: ${statDamageTaken}  |  Bombs Used: ${statBombsUsed}  |  Dashes: ${statDashesUsed}`, cx, cy + 45);

  const key = getLeaderboardKey();
  if (isTopTen(key, kills)) {
    ctx.fillStyle = '#ffdd00'; ctx.font = 'bold 20px monospace';
    ctx.fillText('NEW HIGH SCORE! Press Enter to enter name', cx, cy + 85);
  } else {
    ctx.fillStyle = '#aaa'; ctx.font = 'bold 18px monospace';
    ctx.fillText('Press Enter to return to menu', cx, cy + 85);
  }
  drawHUD();
}

function drawMenu() {
  const cx = canvas.width / 2;
  ctx.fillStyle = '#bb22aa';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('ERIC AND EVA', cx, 70);
  ctx.fillText('DEMON HUNTERS', cx, 120);

  ctx.fillStyle = '#aaa'; ctx.font = '16px monospace';
  ctx.fillText('WASD/Arrows = Move  |  CTRL = Bomb  |  SPACE = Dash', cx, 150);

  const colLeft = cx - 150, colRight = cx + 150, topY = 180;
  const btnW = 200, btnH = 44, gap = 54;

  const diffActive = menuRow === 0;
  ctx.fillStyle = diffActive ? '#fff' : '#666';
  ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
  ctx.fillText('Difficulty', colLeft, topY);
  for (let i = 0; i < difficultyOptions.length; i++) {
    const bx = colLeft - btnW/2, by = topY + 12 + i*gap;
    const sel = i === selectedDifficulty, act = diffActive && sel;
    ctx.fillStyle = act ? '#444' : (sel ? '#333' : '#222'); ctx.fillRect(bx, by, btnW, btnH);
    ctx.strokeStyle = act ? difficultyOptions[i].color : (sel ? '#888' : '#444');
    ctx.lineWidth = act ? 3 : (sel ? 2 : 1); ctx.strokeRect(bx, by, btnW, btnH);
    ctx.fillStyle = sel ? difficultyOptions[i].color : '#777';
    ctx.font = 'bold 20px monospace'; ctx.fillText(difficultyOptions[i].label, colLeft, by+30);
  }

  const timeActive = menuRow === 1;
  ctx.fillStyle = timeActive ? '#fff' : '#666';
  ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
  ctx.fillText('Time Limit', colRight, topY);
  for (let i = 0; i < timeOptions.length; i++) {
    const bx = colRight - btnW/2, by = topY + 12 + i*gap;
    const sel = i === menuTimeSel, act = timeActive && sel;
    ctx.fillStyle = act ? '#444' : (sel ? '#333' : '#222'); ctx.fillRect(bx, by, btnW, btnH);
    ctx.strokeStyle = act ? '#8fbc8f' : (sel ? '#888' : '#444');
    ctx.lineWidth = act ? 3 : (sel ? 2 : 1); ctx.strokeRect(bx, by, btnW, btnH);
    ctx.fillStyle = sel ? '#fff' : '#777';
    ctx.font = 'bold 20px monospace'; ctx.fillText(timeOptions[i].label, colRight, by+30);
  }

  // Leaderboard button
  const lbY = topY + 12 + 4*gap + 10;
  const lbSel = menuRow === 2;
  const lbBtnW = 260, lbBtnH = 44;
  ctx.fillStyle = lbSel ? '#443355' : '#222';
  ctx.fillRect(cx - lbBtnW/2, lbY, lbBtnW, lbBtnH);
  ctx.strokeStyle = lbSel ? '#bb22aa' : '#444';
  ctx.lineWidth = lbSel ? 3 : 1;
  ctx.strokeRect(cx - lbBtnW/2, lbY, lbBtnW, lbBtnH);
  ctx.fillStyle = lbSel ? '#ee66dd' : '#888';
  ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
  ctx.fillText('Leaderboard', cx, lbY + 30);

  const bottomY = lbY + lbBtnH + 20;
  ctx.fillStyle = '#666'; ctx.font = '14px monospace'; ctx.textAlign = 'center';
  ctx.fillText('Left/Right = column  |  Up/Down = select  |  Enter to start', cx, bottomY);
  const diff = difficultyOptions[selectedDifficulty];
  ctx.fillStyle = diff.color; ctx.font = 'bold 18px monospace';
  ctx.fillText(`${diff.label} - ${timeOptions[menuTimeSel].label}`, cx, bottomY + 30);
}

function drawOverlay(title, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = color; ctx.font = 'bold 52px monospace'; ctx.textAlign = 'center';
  ctx.fillText(title, canvas.width/2, canvas.height/2 - 40);

  if (activeDifficulty) {
    ctx.fillStyle = activeDifficulty.color; ctx.font = 'bold 18px monospace';
    ctx.fillText(`Difficulty: ${activeDifficulty.label}`, canvas.width/2, canvas.height/2 + 40);
  }
  const key = getLeaderboardKey();
  if (isTopTen(key, kills)) {
    ctx.fillStyle = '#ffdd00'; ctx.font = 'bold 20px monospace';
    ctx.fillText('NEW HIGH SCORE! Press Enter to enter name', canvas.width/2, canvas.height/2 + 75);

    ctx.fillStyle = '#aaa'; ctx.font = 'bold 18px monospace';
    ctx.fillText('Press Enter to return to menu', canvas.width/2, canvas.height/2 + 75);

}

// --- Victory hearts ---
let victoryHearts = [];
function generateVictoryHearts() {
  victoryHearts = [];
  for (let i = 0; i < 40; i++) {
    victoryHearts.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: 30 + Math.random() * 60,
      color: Math.random() > 0.5 ? '#ff2255' : '#ff88aa',
      rot: (Math.random() - 0.5) * 0.6,
      alpha: 0.5 + Math.random() * 0.5,
    });
  }
}

function drawHeart(cx, cy, size, color, rot, alpha) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  const s = size / 2;
  ctx.moveTo(0, s * 0.4);
  ctx.bezierCurveTo(-s, -s * 0.3, -s, -s, 0, -s * 0.5);
  ctx.bezierCurveTo(s, -s, s, -s * 0.3, 0, s * 0.4);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawVictoryScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw hearts
  if (victoryHearts.length === 0) generateVictoryHearts();
  for (const h of victoryHearts) {
    drawHeart(h.x, h.y, h.size, h.color, h.rot, h.alpha);
  }

  const cx = canvas.width/2, cy = canvas.height/2;
  // Giant "You Won!" text
  ctx.fillStyle = '#ffdd00';
  ctx.font = 'bold 80px monospace'; ctx.textAlign = 'center';
  ctx.fillText('You Won!', cx, cy - 80);

  // Stats
  ctx.fillStyle = '#fff'; ctx.font = 'bold 24px monospace';
  ctx.fillText(`Kills: ${kills}`, cx, cy - 35);
  if (activeDifficulty) {
    ctx.fillStyle = activeDifficulty.color; ctx.font = 'bold 18px monospace';
    ctx.fillText(`Difficulty: ${activeDifficulty.label}`, cx, cy - 5);
  }
  // Boss results
  let bossResultY = cy + 20;
  if (timeLimit === 300 && miniDemonLordSpawned) {
    if (miniDemonLordDefeated) {
      ctx.fillStyle = '#bb66ff'; ctx.font = 'bold 20px monospace';
      ctx.fillText('The Mini-Demon Lord was destroyed!', cx, bossResultY);
    } else {
      ctx.fillStyle = '#ff8844'; ctx.font = 'bold 20px monospace';
      ctx.fillText('The Mini-Demon Lord survived...', cx, bossResultY);
    }
    bossResultY += 28;
  }
  if (timeLimit === 300 && finalBossSpawned) {
    if (finalBossDefeated) {
      ctx.fillStyle = '#44ff44'; ctx.font = 'bold 22px monospace';
      ctx.fillText('The Demon Lord has been slain!', cx, bossResultY);
    } else {
      ctx.fillStyle = '#ff8844'; ctx.font = 'bold 22px monospace';
      ctx.fillText('The Demon Lord escaped...', cx, bossResultY);
    }
    bossResultY += 28;
  }
  // Detailed stats
  const statY = bossResultY - cy + 8;
  ctx.fillStyle = '#aaa'; ctx.font = '16px monospace';
  ctx.fillText(`Level: ${playerLevel}  |  Best Combo: ${statMaxCombo}x`, cx, cy + statY);
  ctx.fillText(`Damage Taken: ${statDamageTaken}  |  Bombs Used: ${statBombsUsed}  |  Dashes: ${statDashesUsed}`, cx, cy + statY + 25);

  const key = getLeaderboardKey();
  if (isTopTen(key, kills)) {
    ctx.fillStyle = '#ffdd00'; ctx.font = 'bold 20px monospace';
    ctx.fillText('NEW HIGH SCORE! Press Enter to enter name', cx, cy + statY + 65);
  } else {
    ctx.fillStyle = '#aaa'; ctx.font = 'bold 18px monospace';
    ctx.fillText('Press Enter to return to menu', cx, cy + statY + 65);
  }
  drawHUD();
}

// --- Pause Screen ---
function drawPauseScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2, cy = canvas.height / 2;
  ctx.fillStyle = '#ff3333'; ctx.font = 'bold 80px monospace'; ctx.textAlign = 'center';
  ctx.fillText('PAUSED', cx, cy - 60);

  // Resume option
  ctx.fillStyle = '#44ff44'; ctx.font = 'bold 28px monospace';
  ctx.fillText('[ENTER]  Resume', cx, cy + 20);

  // Quit option
  ctx.fillStyle = '#ff6644'; ctx.font = 'bold 28px monospace';
  ctx.fillText('[ESC]  Quit to Menu', cx, cy + 70);
}

// --- Name Entry Screen ---
function drawNameEntry() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2, cy = canvas.height / 2;

  ctx.fillStyle = '#ffdd00'; ctx.font = 'bold 40px monospace'; ctx.textAlign = 'center';
  ctx.fillText('NEW HIGH SCORE!', cx, cy - 100);

  ctx.fillStyle = '#fff'; ctx.font = 'bold 24px monospace';
  ctx.fillText(`Score: ${kills}`, cx, cy - 60);

  ctx.fillStyle = '#aaa'; ctx.font = 'bold 18px monospace';
  ctx.fillText('Enter your name (3 characters)', cx, cy - 20);
  ctx.fillText('Up/Down = change letter  |  Left/Right = move', cx, cy + 10);

  // Draw character boxes
  for (let i = 0; i < 3; i++) {
    const bx = cx - 75 + i * 60, by = cy + 30;
    const sel = i === nameEntryPos;
    ctx.fillStyle = sel ? '#333' : '#222';
    ctx.fillRect(bx, by, 50, 60);
    ctx.strokeStyle = sel ? '#ffdd00' : '#555';
    ctx.lineWidth = sel ? 3 : 1;
    ctx.strokeRect(bx, by, 50, 60);
    ctx.fillStyle = sel ? '#ffdd00' : '#fff';
    ctx.font = 'bold 36px monospace'; ctx.textAlign = 'center';
    ctx.fillText(nameEntryChars[i], bx + 25, by + 44);
    // Arrow indicators for selected
    if (sel) {
      ctx.fillStyle = '#ffdd00'; ctx.font = 'bold 16px monospace';
      ctx.fillText('\u25B2', bx + 25, by - 4);
      ctx.fillText('\u25BC', bx + 25, by + 76);
    }
  }

  ctx.fillStyle = '#44ff44'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
  ctx.fillText('Press Enter to confirm', cx, cy + 140);
}

// --- Leaderboard View Screen ---
function drawLeaderboardScreen() {
  ctx.fillStyle = '#1a1420';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;

  ctx.fillStyle = '#bb22aa'; ctx.font = 'bold 48px monospace'; ctx.textAlign = 'center';
  ctx.fillText('LEADERBOARD', cx, 60);

  // Current filter
  const diffLabel = difficultyOptions[lbViewDiffIdx].label;
  const diffColor = difficultyOptions[lbViewDiffIdx].color;
  const timeLabel = timeOptions[lbViewTimeIdx].label;

  ctx.fillStyle = '#aaa'; ctx.font = 'bold 16px monospace';
  ctx.fillText('Left/Right = Difficulty  |  Up/Down = Time  |  Enter = Back', cx, 95);

  ctx.fillStyle = diffColor; ctx.font = 'bold 28px monospace';
  ctx.fillText(`\u25C0  ${diffLabel}  \u25B6`, cx, 140);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px monospace';
  ctx.fillText(`\u25B2  ${timeLabel}  \u25BC`, cx, 175);

  // Scores table
  const scores = getScores(lbViewKey);
  const tableTop = 210;
  const rowH = 36;

  // Header
  ctx.fillStyle = '#666'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
  ctx.fillText('RANK', cx - 200, tableTop);
  ctx.fillText('NAME', cx, tableTop);
  ctx.fillText('KILLS', cx + 200, tableTop);
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx - 300, tableTop + 8); ctx.lineTo(cx + 300, tableTop + 8); ctx.stroke();

  if (scores.length === 0) {
    ctx.fillStyle = '#555'; ctx.font = '18px monospace';
    ctx.fillText('No scores yet', cx, tableTop + 50);
  } else {
    for (let i = 0; i < scores.length; i++) {
      const y = tableTop + 30 + i * rowH;
      const isTop3 = i < 3;
      ctx.fillStyle = isTop3 ? ['#ffdd00', '#cccccc', '#cc8844'][i] : '#888';
      ctx.font = `bold 18px monospace`; ctx.textAlign = 'center';
      ctx.fillText(`${i + 1}`, cx - 200, y);
      ctx.fillStyle = isTop3 ? '#fff' : '#aaa';
      ctx.fillText(scores[i].name, cx, y);
      ctx.fillText(`${scores[i].score}`, cx + 200, y);
    }
  }
}

// ========================================
// GAME LOOP
// ========================================
function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
lastTime = performance.now();
requestAnimationFrame(loop);
</script>
