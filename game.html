<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eric and Eva Demon Hunters</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  canvas { display: block; border: 2px solid #333; max-width: 100vw; max-height: 100vh; }

<body>
<canvas id="game"></canvas>
<script>
// ========================================
// CANVAS SETUP
// ========================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 1920;
canvas.height = 1280;

// --- Generate grass tufts for background ---
const grassTufts = [];
function generateGrass() {
  grassTufts.length = 0;
  for (let i = 0; i < 400; i++) {
    const isGolden = Math.random() > 0.5;
    grassTufts.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      blades: 3 + Math.floor(Math.random() * 5),
      height: 6 + Math.random() * 14,
      spread: 3 + Math.random() * 5,
      color: isGolden
        ? `hsl(${40 + Math.random()*20}, ${50+Math.random()*30}%, ${35+Math.random()*20}%)`
        : `hsl(${100 + Math.random()*40}, ${40+Math.random()*30}%, ${25+Math.random()*20}%)`,
    });
  }
}
generateGrass();

// ========================================
// AUDIO SYSTEM
// ========================================
// --- Audio System (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// --- Lightsaber Sword Sound ---
function playSwordSound() {
  const now = audioCtx.currentTime;
  const dur = 0.25;
  // Base hum - sawtooth for buzzy lightsaber tone
  const osc1 = audioCtx.createOscillator();
  const g1 = audioCtx.createGain();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(120 + Math.random() * 20, now);
  osc1.frequency.exponentialRampToValueAtTime(180 + Math.random() * 30, now + 0.06);
  osc1.frequency.exponentialRampToValueAtTime(100, now + dur);
  g1.gain.setValueAtTime(0.12, now);
  g1.gain.linearRampToValueAtTime(0.18, now + 0.04);
  g1.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc1.connect(g1); g1.connect(audioCtx.destination);
  osc1.start(now); osc1.stop(now + dur);
  // High frequency buzz/sizzle
  const osc2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  const bp = audioCtx.createBiquadFilter();
  osc2.type = 'sawtooth';
  osc2.frequency.setValueAtTime(240, now);
  osc2.frequency.exponentialRampToValueAtTime(360, now + 0.05);
  osc2.frequency.exponentialRampToValueAtTime(200, now + dur);
  bp.type = 'bandpass'; bp.frequency.value = 800; bp.Q.value = 2;
  g2.gain.setValueAtTime(0.08, now);
  g2.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc2.connect(bp); bp.connect(g2); g2.connect(audioCtx.destination);
  osc2.start(now); osc2.stop(now + dur);
  // Swing whoosh - pitch-swept noise
  const bufSize = audioCtx.sampleRate * 0.18;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
  const ns = audioCtx.createBufferSource(); ns.buffer = buf;
  const nf = audioCtx.createBiquadFilter();
  nf.type = 'bandpass'; nf.Q.value = 3;
  nf.frequency.setValueAtTime(3000, now);
  nf.frequency.exponentialRampToValueAtTime(600, now + 0.18);
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.1, now);
  ng.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
  ns.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
  ns.start(now); ns.stop(now + 0.18);
}

// --- Hit Impact ---
function playHitSound() {
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(250, now);
  osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
  gain.gain.setValueAtTime(0.25, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.12);
}

// --- Demon Growl (5 layered voices) ---
let lastGruntTime = 0;
function playDemonGrunt() {
  const now = audioCtx.currentTime;
  if (now - lastGruntTime < 0.4) return;
  lastGruntTime = now;
  const dur = 0.7;
  const baseFreqs = [38, 45, 52, 60, 70];
  for (let v = 0; v < 5; v++) {
    const freq = baseFreqs[v] + Math.random() * 8 - 4;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    // Growling sawtooth
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.setValueAtTime(freq * 1.1, now + 0.1);
    osc.frequency.linearRampToValueAtTime(freq * 0.8, now + dur);
    // Tremolo LFO for growl texture
    const lfo = audioCtx.createOscillator();
    const lfoG = audioCtx.createGain();
    lfo.frequency.value = 4 + v * 1.5 + Math.random() * 2;
    lfoG.gain.value = 0.04;
    lfo.connect(lfoG); lfoG.connect(gain.gain);
    lfo.start(now); lfo.stop(now + dur);
    // Soft volume
    gain.gain.setValueAtTime(0.025, now);
    gain.gain.linearRampToValueAtTime(0.04, now + 0.15);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    // Low pass to keep it soft and rumbly
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(250 + v * 30, now);
    filter.frequency.linearRampToValueAtTime(100, now + dur);
    filter.Q.value = 1;
    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now + v * 0.02); osc.stop(now + dur);
  }
  // Breath noise layer
  const bSize = audioCtx.sampleRate * 0.4;
  const b = audioCtx.createBuffer(1, bSize, audioCtx.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < bSize; i++) d[i] = (Math.random() * 2 - 1);
  const ns = audioCtx.createBufferSource(); ns.buffer = b;
  const nf = audioCtx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 200; nf.Q.value = 0.5;
  const ng = audioCtx.createGain(); ng.gain.setValueAtTime(0.03, now); ng.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  ns.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination); ns.start(now); ns.stop(now + 0.4);
}

// --- Powerup Chime ---
function playPowerupSound() {
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(400, now);
  osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
  osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
  gain.gain.setValueAtTime(0.2, now);
  gain.gain.setValueAtTime(0.25, now + 0.1);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.35);
  const osc2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(600, now + 0.05);
  osc2.frequency.exponentialRampToValueAtTime(1600, now + 0.25);
  g2.gain.setValueAtTime(0.15, now + 0.05);
  g2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
  osc2.connect(g2); g2.connect(audioCtx.destination);
  osc2.start(now + 0.05); osc2.stop(now + 0.3);
}

// --- Rocket Shoot ---
function playShootSound() {
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
  gain.gain.setValueAtTime(0.1, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.12);
}

// --- Intense Rocket Explosion ---
function playExplosionSound() {
  const now = audioCtx.currentTime;
  // Initial crack
  const osc = audioCtx.createOscillator();
  const og = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(400, now);
  osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
  og.gain.setValueAtTime(0.3, now);
  og.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
  osc.connect(og); og.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.3);
  // Heavy noise burst
  const bufSize = audioCtx.sampleRate * 0.5;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
  const noise = audioCtx.createBufferSource(); noise.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(2000, now);
  filter.frequency.exponentialRampToValueAtTime(80, now + 0.4);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.35, now);
  gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start(now); noise.stop(now + 0.5);
  // Sub bass thump
  const sub = audioCtx.createOscillator();
  const sg = audioCtx.createGain();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(60, now);
  sub.frequency.exponentialRampToValueAtTime(25, now + 0.35);
  sg.gain.setValueAtTime(0.25, now);
  sg.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
  sub.connect(sg); sg.connect(audioCtx.destination);
  sub.start(now); sub.stop(now + 0.35);
}

// --- Loud Bomb Boom ---
function playBombSound() {
  const now = audioCtx.currentTime;
  // Massive sub bass
  const sub = audioCtx.createOscillator();
  const sg = audioCtx.createGain();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(50, now);
  sub.frequency.exponentialRampToValueAtTime(15, now + 1.2);
  sg.gain.setValueAtTime(0.6, now);
  sg.gain.linearRampToValueAtTime(0.4, now + 0.1);
  sg.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
  sub.connect(sg); sg.connect(audioCtx.destination);
  sub.start(now); sub.stop(now + 1.2);
  // Initial sharp crack
  const crack = audioCtx.createOscillator();
  const cg = audioCtx.createGain();
  crack.type = 'square';
  crack.frequency.setValueAtTime(300, now);
  crack.frequency.exponentialRampToValueAtTime(20, now + 0.15);
  cg.gain.setValueAtTime(0.5, now);
  cg.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  crack.connect(cg); cg.connect(audioCtx.destination);
  crack.start(now); crack.stop(now + 0.15);
  // Heavy rumble noise
  const bufSize = audioCtx.sampleRate * 1.0;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
  const noise = audioCtx.createBufferSource(); noise.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800, now);
  filter.frequency.exponentialRampToValueAtTime(30, now + 1.0);
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.45, now);
  ng.gain.linearRampToValueAtTime(0.3, now + 0.1);
  ng.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
  noise.connect(filter); filter.connect(ng); ng.connect(audioCtx.destination);
  noise.start(now); noise.stop(now + 1.0);
  // Second rumble layer for body
  const noise2 = audioCtx.createBufferSource(); noise2.buffer = buf;
  const f2 = audioCtx.createBiquadFilter();
  f2.type = 'lowpass'; f2.frequency.setValueAtTime(200, now); f2.frequency.exponentialRampToValueAtTime(40, now + 0.8);
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.3, now + 0.05);
  g2.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
  noise2.connect(f2); f2.connect(g2); g2.connect(audioCtx.destination);
  noise2.start(now); noise2.stop(now + 0.8);
}

// --- Dash Whoosh ---
function playDashSound() {
  const now = audioCtx.currentTime;
  const dur = 0.35;
  // Fast pitch-swept noise whoosh
  const bufSize = audioCtx.sampleRate * dur;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
  const noise = audioCtx.createBufferSource(); noise.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass'; filter.Q.value = 1.5;
  filter.frequency.setValueAtTime(400, now);
  filter.frequency.exponentialRampToValueAtTime(3000, now + 0.08);
  filter.frequency.exponentialRampToValueAtTime(300, now + dur);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.01, now);
  gain.gain.linearRampToValueAtTime(0.3, now + 0.06);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start(now); noise.stop(now + dur);
  // Tonal wind element
  const osc = audioCtx.createOscillator();
  const og = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(200, now);
  osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
  osc.frequency.exponentialRampToValueAtTime(150, now + dur);
  og.gain.setValueAtTime(0.06, now);
  og.gain.linearRampToValueAtTime(0.1, now + 0.08);
  og.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc.connect(og); og.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + dur);
}

window.addEventListener('keydown', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

// ========================================
// GAME STATE & CONSTANTS
// ========================================
// --- Game State ---
let state = 'menu'; // menu, playing, paused, gameover, victory, nameentry, leaderboard
let timeLimit = 0;
let timeRemaining = 0;
let kills = 0;
let lastTime = 0;
let spawnTimer = 0;
let spawnInterval = 1.5;
let difficultyTimer = 0;

// --- Screen Shake ---
let shakeX = 0, shakeY = 0, shakeIntensity = 0, shakeDuration = 0;
function triggerShake(intensity, duration) {
  shakeIntensity = intensity;
  shakeDuration = duration;
}

// --- Combo System ---
let comboCount = 0;
let comboTimer = 0;
const COMBO_WINDOW = 2.0;
let comboBest = 0;

// --- Damage Numbers ---
let floatingTexts = [];
function spawnFloatingText(x, y, text, color, size) {
  floatingTexts.push({ x, y, text, color, size: size || 16, life: 1.0, maxLife: 1.0, vy: -40 });
}

// --- Kill Counter Animation ---
let killFlashTimer = 0;

// --- Stats Tracking ---
let statDamageTaken = 0;
let statBombsUsed = 0;
let statDashesUsed = 0;
let statMaxCombo = 0;
let gameStartTime = 0;

// --- Milestone Banners ---
let milestoneBanner = '';
let milestoneBannerTimer = 0;
const milestoneThresholds = [50, 100, 200];
let milestonesShown = {};

// --- Wave Announcement ---
let waveAnnounceTimer = 0;
let waveAnnounceText = '';

// --- Controls Legend ---
let controlsLegendTimer = 10;

// --- XP / Level-Up System ---
const XP_PER_LEVEL = 90;
let playerXP = 0;
let playerLevel = 0;
let xpToNext = XP_PER_LEVEL;
let levelUpChoices = [];
let levelUpActive = false;
const UPGRADE_POOL = [
  { name: 'Piercing Rockets', icon: '\u{1F4A5}', desc: 'Rockets pass through enemies', apply: () => { rocketPiercing = true; }, once: true },
  { name: 'Faster Swing', icon: '\u26A1', desc: 'Sword swings 50% faster', apply: () => { swingSpeedMult *= 1.5; }, weight: 0.5 },
  { name: 'Faster Rockets', icon: '\u{1F680}', desc: 'Rockets fly 40% faster', apply: () => { rocketSpeedMult *= 1.4; } },
  { name: 'Boss Slayer', icon: '\u{1F480}', desc: 'Sword does 3 dmg to bosses', apply: () => { swordBossDamage = 3; } },
  { name: 'Quick Dash', icon: '\u{1F4A8}', desc: 'Dash cooldown -1s', apply: () => { dashCooldownReduction += 1; } },
  { name: 'Heal +25', icon: '\u2764\uFE0F', desc: 'Restore 25 HP now', apply: () => { player.health = Math.min(100, player.health + 25); } },
  { name: 'Tough Skin', icon: '\u{1F6E1}\uFE0F', desc: 'Brief invincibility on hit +0.5s', apply: () => { invincibilityBonus += 0.5; } },
  { name: 'Longer Swing', icon: '\u2694\uFE0F', desc: '+25% sword reach', apply: () => { swordRangeMult *= 1.25; } },
  { name: 'Speed Boost', icon: '\u{1F3C3}', desc: '+15% movement speed', apply: () => { player.speed *= 1.15; } },
  { name: 'Wider Slash', icon: '\u{1F300}', desc: '+25% sword arc width', apply: () => { swordArcMult *= 1.25; } },
  { name: 'Blast Radius', icon: '\u{1F4A3}', desc: '+30% rocket explosion size', apply: () => { explosionRadiusMult *= 1.3; } },
  { name: 'Shield', icon: '\u{1F6E1}\uFE0F', desc: 'Damage shield for 8 seconds', apply: () => { playerShield = 8; } },
];
let dashCooldownReduction = 0;
let invincibilityBonus = 0;
let swordArcMult = 1;
let swordRangeMult = 1;
let explosionRadiusMult = 1;
let playerShield = 0;
let appliedOnce = {};

function grantXP(amount) {
  if (levelUpActive) return;
  playerXP += amount;
  while (playerXP >= xpToNext) {
    playerXP -= xpToNext;
    playerLevel++;
    xpToNext = XP_PER_LEVEL + playerLevel * 30;
    showLevelUpChoices();
  }
}

function showLevelUpChoices() {
  const available = UPGRADE_POOL.filter(u => !u.once || !appliedOnce[u.name]);
  // Weighted random selection: lower weight = less likely to appear
  const weighted = available.map(u => ({ upgrade: u, sortKey: Math.random() ** (1 / (u.weight || 1)) }));
  weighted.sort((a, b) => b.sortKey - a.sortKey);
  levelUpChoices = weighted.slice(0, Math.min(3, weighted.length)).map(w => w.upgrade);
  if (levelUpChoices.length > 0) {
    levelUpActive = true;
    levelUpSelection = 0;
  }
}
let levelUpSelection = 0;

// ========================================
// BACKGROUND MUSIC
// ========================================
// --- Background Music (with intensity scaling) ---
let musicPlaying = false;
let musicGain = null;
let musicTimeout = null;
let musicBeat = 0;
let musicTempo = 220; // ms per beat, decreases over time

function getMusicTempo() {
  if (!timeLimit || !timeRemaining) return 220;
  const bossAlive = finalBoss && finalBoss.hp > 0;
  if (bossAlive) return bossPhase === 2 ? 110 : 140; // Boss fight: aggressive
  const elapsed = timeLimit - timeRemaining;
  const pct = elapsed / timeLimit;
  return Math.round(220 - pct * 80); // 220ms -> 140ms over game duration
}

function scheduleBeat() {
  if (!musicPlaying) return;
  musicTempo = getMusicTempo();
  musicTimeout = setTimeout(() => {
    if (!musicPlaying) return;
    if (state !== 'playing' && state !== 'paused') { scheduleBeat(); return; }
    const now = audioCtx.currentTime;
    const beat = musicBeat;
    const bossAlive = finalBoss && finalBoss.hp > 0;
    const intensity = bossAlive ? 1.5 : 1;

    // Kick
    if (beat % 4 === 0 || (bossAlive && beat % 2 === 0)) {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(bossAlive ? 60 : 80, now);
      o.frequency.exponentialRampToValueAtTime(bossAlive ? 20 : 30, now + 0.15);
      g.gain.setValueAtTime(0.3 * intensity, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      o.connect(g); g.connect(musicGain); o.start(now); o.stop(now + 0.2);
    }
    // Snare
    if (beat % 4 === 2) {
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const ns = audioCtx.createBufferSource(); ns.buffer = buf;
      const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 800;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.15 * intensity, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      ns.connect(f); f.connect(g); g.connect(musicGain); ns.start(now); ns.stop(now + 0.1);
    }
    // Hi-hat
    if (beat % 2 === 1) {
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const ns = audioCtx.createBufferSource(); ns.buffer = buf;
      const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 5000;
      const hg = audioCtx.createGain(); hg.gain.setValueAtTime(0.06 * intensity, now);
      hg.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      ns.connect(f); f.connect(hg); hg.connect(musicGain); ns.start(now); ns.stop(now + 0.05);
    }
    // Bass note every 8 beats
    if (beat % 8 === 0) {
      const bass = audioCtx.createOscillator(); const bg = audioCtx.createGain();
      bass.type = 'sawtooth';
      const notes = bossAlive ? [36.7, 41.2, 36.7, 32.7] : [55, 55, 65.4, 49];
      bass.frequency.value = notes[Math.floor(beat / 8) % notes.length];
      const bf = audioCtx.createBiquadFilter(); bf.type = 'lowpass'; bf.frequency.value = bossAlive ? 250 : 200;
      bg.gain.setValueAtTime(0.12 * intensity, now); bg.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      bass.connect(bf); bf.connect(bg); bg.connect(musicGain); bass.start(now); bass.stop(now + 0.35);
    }
    musicBeat++;
    scheduleBeat();
  }, musicTempo);
}

function startMusic() {
  if (musicPlaying) return;
  musicPlaying = true;
  musicBeat = 0;
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.08;
  musicGain.connect(audioCtx.destination);
  scheduleBeat();
}
function stopMusic() {
  if (musicTimeout) { clearTimeout(musicTimeout); musicTimeout = null; }
  musicPlaying = false;
}

function getLeaderboardKey() {
  return `${activeDifficulty.label}-${timeLimit}`;
}
function loadLeaderboard() {
  try { return JSON.parse(localStorage.getItem('demonHuntersLB')) || {}; } catch(e) { return {}; }
}
function saveLeaderboard(lb) {
  localStorage.setItem('demonHuntersLB', JSON.stringify(lb));
}
function getScores(key) {
  const lb = loadLeaderboard();
  return lb[key] || [];
}
function addScore(key, name, score) {
  const lb = loadLeaderboard();
  if (!lb[key]) lb[key] = [];
  lb[key].push({ name, score });
  lb[key].sort((a, b) => b.score - a.score);
  lb[key] = lb[key].slice(0, 10);
  saveLeaderboard(lb);
}
function isTopTen(key, score) {
  const scores = getScores(key);
  if (scores.length < 10) return true;
  return score > scores[scores.length - 1].score;
}

function playBossRoar() {
  const now = audioCtx.currentTime;
  for (let v = 0; v < 8; v++) {
    const freq = 25 + v * 5 + Math.random() * 5;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.linearRampToValueAtTime(freq * 0.5, now + 1.5);
    gain.gain.setValueAtTime(0.06, now);
    gain.gain.linearRampToValueAtTime(0.1, now + 0.3);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
    filter.type = 'lowpass'; filter.frequency.value = 180 + v * 20;
    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now + v * 0.03); osc.stop(now + 1.5);
  }
  // Rumble noise
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 1.2, audioCtx.sampleRate);
  const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1);
  const ns = audioCtx.createBufferSource(); ns.buffer = buf;
  const nf = audioCtx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 120;
  const ng = audioCtx.createGain(); ng.gain.setValueAtTime(0.15, audioCtx.currentTime);
  ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
  ns.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
  ns.start(audioCtx.currentTime); ns.stop(audioCtx.currentTime + 1.2);
}

function generateBolt(tx, ty) {
  const pts = [{ x: tx + (Math.random() - 0.5) * 200, y: -20 }];
  let cx = pts[0].x, cy = pts[0].y;
  const segs = 12 + Math.floor(Math.random() * 8);
  const stepY = (ty - cy) / segs;
  for (let i = 1; i <= segs; i++) {
    cx += (Math.random() - 0.5) * 80;
    cy += stepY;
    pts.push({ x: cx, y: cy });
  }
  pts.push({ x: tx, y: ty });
  return pts;
}

// --- Input ---
const keys = {};
let menuRow = 0; // 0=difficulty, 1=time, 2=leaderboard button
let menuTimeSel = 0;
const timeOptions = [
  { label: '1 Minute',  time: 60 },
  { label: '2 Minutes', time: 120 },
  { label: '5 Minutes', time: 300 },
];

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  e.preventDefault();
  if (state === 'menu') {
    const up = e.code === 'ArrowUp' || e.code === 'KeyW';
    const down = e.code === 'ArrowDown' || e.code === 'KeyS';
    const left = e.code === 'ArrowLeft' || e.code === 'KeyA';
    const right = e.code === 'ArrowRight' || e.code === 'KeyD';
    if (menuRow === 2) {
      if (up) menuRow = 0;
      if (e.code === 'Enter' || e.code === 'Space') {
        lbViewDiffIdx = selectedDifficulty;
        lbViewTimeIdx = menuTimeSel;
        lbViewKey = difficultyOptions[lbViewDiffIdx].label + '-' + timeOptions[lbViewTimeIdx].time;
        state = 'leaderboard';
      }
    } else {
      if (up) {
        if (menuRow === 0) selectedDifficulty = (selectedDifficulty - 1 + difficultyOptions.length) % difficultyOptions.length;
        else menuTimeSel = (menuTimeSel - 1 + timeOptions.length) % timeOptions.length;
      }
      if (down) {
        if (menuRow === 0) {
          if (selectedDifficulty === difficultyOptions.length - 1) menuRow = 2;
          else selectedDifficulty++;
        } else {
          if (menuTimeSel === timeOptions.length - 1) menuRow = 2;
          else menuTimeSel++;
        }
      }
      if (left) menuRow = 0;
      if (right) menuRow = 1;
      if (e.code === 'Enter' || e.code === 'Space') startGame(timeOptions[menuTimeSel].time);
    }
  } else if (state === 'playing') {
    if (levelUpActive) {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') levelUpSelection = (levelUpSelection - 1 + levelUpChoices.length) % levelUpChoices.length;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') levelUpSelection = (levelUpSelection + 1) % levelUpChoices.length;
      if (e.code === 'Enter' || e.code === 'Space') {
        const choice = levelUpChoices[levelUpSelection];
        choice.apply();
        if (choice.once) appliedOnce[choice.name] = true;
        levelUpActive = false;
        levelUpChoices = [];
        playPowerupSound();
      }
      return;
    }
    if (e.code === 'ControlLeft' || e.code === 'ControlRight') useBomb();
    if (e.code === 'Space') useDash();
    if (e.code === 'Enter') state = 'paused';
  } else if (state === 'paused') {
    if (e.code === 'Enter') state = 'playing';
    if (e.code === 'Escape') { state = 'menu'; stopMusic(); }
  } else if (state === 'gameover' || state === 'victory') {
    if (e.code === 'Enter' || e.code === 'Space') {
      const key = getLeaderboardKey();
      if (isTopTen(key, kills)) {
        nameEntryChars = ['A', 'A', 'A'];
        nameEntryPos = 0;
        nameEntrySource = state;
        state = 'nameentry';
      } else {
        state = 'menu'; victoryHearts = [];
      }
    }
  } else if (state === 'nameentry') {
    const up = e.code === 'ArrowUp' || e.code === 'KeyW';
    const down = e.code === 'ArrowDown' || e.code === 'KeyS';
    const left = e.code === 'ArrowLeft' || e.code === 'KeyA';
    const right = e.code === 'ArrowRight' || e.code === 'KeyD';
    if (up) {
      const c = nameEntryChars[nameEntryPos].charCodeAt(0);
      nameEntryChars[nameEntryPos] = String.fromCharCode(c >= 90 ? 65 : c + 1);
    }
    if (down) {
      const c = nameEntryChars[nameEntryPos].charCodeAt(0);
      nameEntryChars[nameEntryPos] = String.fromCharCode(c <= 65 ? 90 : c - 1);
    }
    if (right) nameEntryPos = Math.min(2, nameEntryPos + 1);
    if (left) nameEntryPos = Math.max(0, nameEntryPos - 1);
    if (e.code === 'Enter') {
      addScore(getLeaderboardKey(), nameEntryChars.join(''), kills);
      state = 'menu'; victoryHearts = [];
    }
  } else if (state === 'leaderboard') {
    const left = e.code === 'ArrowLeft' || e.code === 'KeyA';
    const right = e.code === 'ArrowRight' || e.code === 'KeyD';
    const up = e.code === 'ArrowUp' || e.code === 'KeyW';
    const down = e.code === 'ArrowDown' || e.code === 'KeyS';
    if (left) lbViewDiffIdx = (lbViewDiffIdx - 1 + difficultyOptions.length) % difficultyOptions.length;
    if (right) lbViewDiffIdx = (lbViewDiffIdx + 1) % difficultyOptions.length;
    if (up) lbViewTimeIdx = (lbViewTimeIdx - 1 + timeOptions.length) % timeOptions.length;
    if (down) lbViewTimeIdx = (lbViewTimeIdx + 1) % timeOptions.length;
    lbViewKey = difficultyOptions[lbViewDiffIdx].label + '-' + timeOptions[lbViewTimeIdx].time;
    if (e.code === 'Enter' || e.code === 'Space') state = 'menu';
  }
});

// --- Bomb ---
function useBomb() {
  if (bombs <= 0 || bombCooldown > 0) return;
  bombs--;
  bombCooldown = BOMB_USE_COOLDOWN;
  bombRegenTimers.push(BOMB_REGEN_TIME);
  bombExplosions.push({ x: player.x, y: player.y, life: BOMB_EXPLOSION_DUR, maxLife: BOMB_EXPLOSION_DUR });
  playBombSound();
  triggerShake(12, 0.4);
  statBombsUsed++;
  for (let i = demons.length - 1; i >= 0; i--) {
    const d = demons[i];
    const ddx = player.x - d.x, ddy = player.y - d.y;
    if (ddx*ddx+ddy*ddy < BOMB_RADIUS*BOMB_RADIUS) {
      if (d.type === 'finalBoss') {
        // Bomb does 50 damage to Demon Lord instead of insta-kill
        d.hp -= 50;
        spawnBlood(d.x, d.y, 30);
        spawnFloatingText(d.x, d.y - d.radius, '-50', '#ff8844', 28);
        playHitSound();
        if (d.hp <= 0) {
          spawnBlood(d.x, d.y, 60);
          demons.splice(i, 1);
          kills++;
        }
      } else if (d.type === 'miniDemonLord') {
        // Bomb does 50 damage to Mini-Demon Lord, then it teleports
        d.hp -= 50;
        spawnBlood(d.x, d.y, 30);
        spawnFloatingText(d.x, d.y - d.radius, '-50', '#cc88ff', 28);
        playHitSound();
        if (d.hp <= 0) {
          triggerMiniDemonLordExplosion();
          miniDemonLordDefeated = true;
          miniDemonLord = null;
          spawnBlood(d.x, d.y, 60);
          demons.splice(i, 1);
          kills++;
        } else {
          checkMiniDemonLordTeleport();
        }
      } else {
        killDemon(i);
      }
    }
  }
}

// --- Dash ---
function useDash() {
  if (dashCooldown > 0) {
    // Penalty for dashing during cooldown
    damagePlayer(10, 0.5, { shake: 8, shakeDur: 0.2, blood: 10, label: 'DASH PENALTY -10 HP', color: '#ff2222', fontSize: 22, textOffY: 30 });
    return;
  }
  dashCooldown = Math.max(0.5, DASH_COOLDOWN - dashCooldownReduction);
  statDashesUsed++;
  player.invincible = 0.4;
  const startX = player.x, startY = player.y;
  const cosA = Math.cos(player.angle), sinA = Math.sin(player.angle);
  // Move player
  player.x += cosA * DASH_DISTANCE;
  player.y += sinA * DASH_DISTANCE;
  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
  // Create fire trail segments along the path
  const actualDx = player.x - startX, actualDy = player.y - startY;
  const actualDist = Math.sqrt(actualDx*actualDx + actualDy*actualDy);
  const segments = Math.ceil(actualDist / (DASH_TRAIL_RADIUS * 1.2));
  for (let i = 0; i <= segments; i++) {
    const t = segments > 0 ? i / segments : 0;
    fireTrail.push({
      x: startX + actualDx * t,
      y: startY + actualDy * t,
      radius: DASH_TRAIL_RADIUS,
      life: DASH_TRAIL_LIFE,
      maxLife: DASH_TRAIL_LIFE,
    });
  }
  playDashSound();
}

// --- Spawn Demon ---
function pickDemonType() {
  if (kills >= 200 && Math.random() < 0.03) return 'green';
  const pool = [Math.random() > 0.5 ? 'red' : 'pink'];
  if (kills >= 50) pool.push('yellow', Math.random() > 0.5 ? 'red' : 'pink');
  if (kills >= 100) pool.push('blue', 'yellow');
  return pool[Math.floor(Math.random() * pool.length)];
}

function spawnDemon() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  const margin = 30;
  switch (side) {
    case 0: x = -margin; y = Math.random() * canvas.height; break;
    case 1: x = canvas.width + margin; y = Math.random() * canvas.height; break;
    case 2: x = Math.random() * canvas.width; y = -margin; break;
    case 3: x = Math.random() * canvas.width; y = canvas.height + margin; break;
  }
  const timeMult = 1 + difficultyTimer * 0.015;
  const diffSpeedMult = activeDifficulty ? activeDifficulty.speedMult : 1;
  const typeName = pickDemonType();
  const typeData = DEMON_TYPES[typeName];
  const isBoss = typeName === 'green';
  demons.push({
    x, y,
    speed: DEMON_BASE_SPEED * timeMult * diffSpeedMult * (0.8 + Math.random() * 0.5) * (isBoss ? 0.6 : 1),
    radius: isBoss ? (14 + Math.random() * 4) * 4 : 14 + Math.random() * 4,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 2 + Math.random() * 3,
    limbPhase: Math.random() * Math.PI * 2,
    type: typeName,
    hp: typeData.hp,
    maxHp: typeData.hp,
  });
}

function spawnPowerup() {
  const margin = 60;
  powerups.push({
    x: margin + Math.random() * (canvas.width - margin * 2),
    y: margin + Math.random() * (canvas.height - margin * 2),
    radius: 32,
    bobPhase: Math.random() * Math.PI * 2,
  });
}

function spawnHealthPowerup() {

// --- Particles ---
function spawnBlood(x, y, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 40 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0.3+Math.random()*0.5, maxLife: 0.3+Math.random()*0.5,
      color: Math.random()>0.3?'#8b0000':'#5a0000', size: 2+Math.random()*3 });
  }
}

function spawnSlashEffect(x, y, angle) {
  slashEffects.push({ x, y, angle, life: 0.2, maxLife: 0.2 });
  for (let i = 0; i < 8; i++) {
    const a = angle - SWORD_ARC*swordArcMult/2 + Math.random() * SWORD_ARC*swordArcMult;
    const dist = SWORD_RANGE * swordRangeMult * (0.5 + Math.random() * 0.5);
    const sp = 30 + Math.random() * 60;
    particles.push({ x: x+Math.cos(a)*dist*0.5, y: y+Math.sin(a)*dist*0.5,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0.15+Math.random()*0.2, maxLife: 0.15+Math.random()*0.2,

}
