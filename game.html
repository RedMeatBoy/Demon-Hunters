// Kill a demon and apply all rewards (combo, XP, milestones, powerup spawn)
function killDemon(demonIndex) {
  const d = demons[demonIndex];
  const isBig = d.type === 'green' || d.type === 'miniDemonLord';

  if (d.type === 'miniDemonLord') {
    triggerMiniDemonLordExplosion();
    miniDemonLordDefeated = true;
    miniDemonLord = null;
  }

  spawnBlood(d.x, d.y, isBig ? 40 : 12);
  playDemonGrunt();
  demons.splice(demonIndex, 1);

  kills++;
  killFlashTimer = 0.3;
  comboCount++; comboTimer = COMBO_WINDOW;
  if (comboCount > comboBest) comboBest = comboCount;
  if (comboCount > statMaxCombo) statMaxCombo = comboCount;

  const xpAmount = d.type === 'miniDemonLord' ? 50 : d.type === 'green' ? 10
    : d.type === 'blue' ? 3 : d.type === 'yellow' ? 2 : 1;
  grantXP(xpAmount);

  if (kills >= nextPowerupAt) { spawnPowerup(); nextPowerupAt += 100; }
  for (const mt of milestoneThresholds) {
    if (kills >= mt && !milestonesShown[mt]) {
      milestonesShown[mt] = true;
      milestoneBanner = `${mt} KILLS!`;
      milestoneBannerTimer = 3.0;
    }
  }
}

// Hit a demon for damage. Returns true if the demon died (was removed from array).
function hitDemon(demonIndex, damage, opts) {
  opts = opts || {};
  const d = demons[demonIndex];
  d.hp -= damage;
  spawnFloatingText(d.x, d.y - d.radius, `-${damage}`, opts.color || '#ffcc00', opts.fontSize || (damage > 1 ? 22 : 16));
  if (opts.shake) triggerShake(opts.shake, opts.shakeDur || 0.08);

  if (d.type === 'miniDemonLord' && d.hp > 0) {
    checkMiniDemonLordTeleport();
  }

  if (d.hp <= 0) {
    killDemon(demonIndex);
    return true;
  } else {
    spawnBlood(d.x, d.y, 5);
    playHitSound();
    return false;
  }
}

// Damage the player. Caller must check invincibility/shield before calling.
// Returns true if the player died.
function damagePlayer(amount, invincDuration, opts) {
  opts = opts || {};
  player.health -= amount;
  statDamageTaken += amount;
  player.invincible = invincDuration;
  triggerShake(opts.shake || 5, opts.shakeDur || 0.15);
  spawnBlood(player.x, player.y, opts.blood || 6);
  spawnFloatingText(player.x, player.y - (opts.textOffY || 20),
    opts.label || `-${amount} HP`, opts.color || '#ff4444', opts.fontSize || 18);
  if (opts.sound === 'explosion') playExplosionSound();
  else playHitSound();
  if (player.health <= 0) {
    player.health = 0;
    state = 'gameover';
    stopMusic();
    return true;
  }
  return false;
}

// --- Angle utility ---
function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

// ========================================
// UPDATE SUB-SYSTEMS
// ========================================

function updateDemonMovement(dt) {
  for (const d of demons) {
    const ax = player.x - d.x, ay = player.y - d.y;
    const distToPlayer = Math.sqrt(ax*ax + ay*ay);
    d.wobble += d.wobbleSpeed * dt;
    d.limbPhase += d.speed * dt * 0.15;
    const baseAngle = Math.atan2(ay, ax);

    if (d.type === 'pink') {
      const zigzag = Math.sin(d.wobble * 3) * 1.0;
      d.x += Math.cos(baseAngle + zigzag) * d.speed * 1.15 * dt;
      d.y += Math.sin(baseAngle + zigzag) * d.speed * 1.15 * dt;
    } else if (d.type === 'yellow') {
      const chargeMult = distToPlayer < 250 ? 1.8 : 0.7;
      const wobbleAngle = Math.sin(d.wobble) * 0.2;
      d.x += Math.cos(baseAngle + wobbleAngle) * d.speed * chargeMult * dt;
      d.y += Math.sin(baseAngle + wobbleAngle) * d.speed * chargeMult * dt;
    } else if (d.type === 'blue') {
      if (distToPlayer < 350 && distToPlayer > 120) {
        const strafeAngle = baseAngle + Math.PI / 2 * Math.sign(Math.sin(d.wobble));
        d.x += Math.cos(strafeAngle) * d.speed * 0.6 * dt + Math.cos(baseAngle) * d.speed * 0.4 * dt;
        d.y += Math.sin(strafeAngle) * d.speed * 0.6 * dt + Math.sin(baseAngle) * d.speed * 0.4 * dt;
      } else {
        const wobbleAngle = Math.sin(d.wobble) * 0.3;
        d.x += Math.cos(baseAngle + wobbleAngle) * d.speed * dt;
        d.y += Math.sin(baseAngle + wobbleAngle) * d.speed * dt;
      }
    } else if (d.type === 'finalBoss') {
      const phaseMult = bossPhase === 2 ? 1.6 : 1;
      const wobbleAngle = Math.sin(d.wobble) * 0.15;
      d.x += Math.cos(baseAngle + wobbleAngle) * d.speed * phaseMult * dt;
      d.y += Math.sin(baseAngle + wobbleAngle) * d.speed * phaseMult * dt;
    } else {
      const wobbleAngle = Math.sin(d.wobble) * 0.4;
      d.x += Math.cos(baseAngle + wobbleAngle) * d.speed * dt;
      d.y += Math.sin(baseAngle + wobbleAngle) * d.speed * dt;
    }
  }

  // Demon-to-demon separation (push apart to prevent stacking)
  for (let i = 0; i < demons.length; i++) {
    for (let j = i + 1; j < demons.length; j++) {
      const a = demons[i], b = demons[j];
      const sdx = a.x - b.x, sdy = a.y - b.y;
      const sdist = Math.sqrt(sdx*sdx + sdy*sdy) || 1;
      const minSep = (a.radius + b.radius) * 0.9;
      if (sdist < minSep) {
        const push = (minSep - sdist) * 0.3;
        const nx = sdx / sdist, ny = sdy / sdist;
        a.x += nx * push; a.y += ny * push;
        b.x -= nx * push; b.y -= ny * push;
      }
    }
  }
}

// Returns true if player died
function updateBossProjectiles(dt) {
  // Boss Teleport AOE update
  for (let i = bossTeleportAOEs.length - 1; i >= 0; i--) {
    const aoe = bossTeleportAOEs[i];
    aoe.life -= dt;
    if (aoe.life <= 0) { bossTeleportAOEs.splice(i, 1); continue; }
    const pdx = aoe.x - player.x, pdy = aoe.y - player.y;
    const pdist = Math.sqrt(pdx*pdx + pdy*pdy);
    if (pdist < aoe.radius + player.radius && player.invincible <= 0 && playerShield <= 0 && !aoe.playerHit) {
      aoe.playerHit = true;
      if (damagePlayer(20, 1.5, { shake: 15, shakeDur: 0.5, blood: 20, label: '-20 HP', color: '#ff4400', fontSize: 30, textOffY: 30, sound: 'explosion' })) return true;
    }
  }

  // Boss shockwaves
  for (let i = bossShockwaves.length - 1; i >= 0; i--) {
    const sw = bossShockwaves[i];
    sw.radius += sw.speed * dt;
    sw.life -= dt;
    if (sw.life <= 0 || sw.radius > sw.maxRadius) { bossShockwaves.splice(i, 1); continue; }
    const distToP = Math.sqrt((sw.x - player.x)**2 + (sw.y - player.y)**2);
    const ringWidth = 30;
    if (Math.abs(distToP - sw.radius) < ringWidth + player.radius && player.invincible <= 0 && playerShield <= 0) {
      if (damagePlayer(5, 1.0, { shake: 8, shakeDur: 0.2, blood: 10, color: '#ff2222', fontSize: 22 })) return true;
    }
  }

  // Boss fireballs
  for (let i = bossFireballs.length - 1; i >= 0; i--) {
    const fb = bossFireballs[i];
    const toPlayerAngle = Math.atan2(player.y - fb.y, player.x - fb.x);
    const curAngle = Math.atan2(fb.vy, fb.vx);
    let da = toPlayerAngle - curAngle;
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    const turnRate = 1.2 * dt;
    const newAngle = curAngle + Math.sign(da) * Math.min(Math.abs(da), turnRate);
    const spd = Math.sqrt(fb.vx*fb.vx + fb.vy*fb.vy);
    fb.vx = Math.cos(newAngle) * spd;
    fb.vy = Math.sin(newAngle) * spd;
    fb.x += fb.vx * dt;
    fb.y += fb.vy * dt;
    fb.life -= dt;
    if (fb.life <= 0 || fb.x < -50 || fb.x > canvas.width+50 || fb.y < -50 || fb.y > canvas.height+50) {
      bossFireballs.splice(i, 1); continue;
    }
    const fdx = fb.x - player.x, fdy = fb.y - player.y;
    if (fdx*fdx+fdy*fdy < (fb.radius+player.radius)*(fb.radius+player.radius) && player.invincible <= 0 && playerShield <= 0) {
      bossFireballs.splice(i, 1);
      if (damagePlayer(8, 1.2, { shake: 10, shakeDur: 0.3, blood: 12, color: '#ff0000', fontSize: 26, sound: 'explosion' })) return true;
    }
  }

  // Thrown demons (from Mini-Demon Lord)
  for (let i = thrownDemons.length - 1; i >= 0; i--) {
    const td = thrownDemons[i];
    td.x += td.vx * dt;
    td.y += td.vy * dt;
    td.life -= dt;
    td.rotation += dt * 12;
    if (td.life <= 0 || td.x < -100 || td.x > canvas.width + 100 || td.y < -100 || td.y > canvas.height + 100) {
      thrownDemons.splice(i, 1);
      continue;
    }
    const tdx = td.x - player.x, tdy = td.y - player.y;
    if (tdx*tdx + tdy*tdy < (td.radius + player.radius) * (td.radius + player.radius) && player.invincible <= 0 && playerShield <= 0) {
      thrownDemons.splice(i, 1);
      if (damagePlayer(5, 1.0, { shake: 10, shakeDur: 0.3, blood: 12, label: '-5 HP', color: '#ff44ff', fontSize: 24, textOffY: 30 })) return true;
    }
  }

  return false;
}

// Returns true if player died
function updateWeather(dt) {
  // Rain
  for (const drop of rainDrops) {
    drop.x += RAIN_SPEED_X * drop.speed * dt;
    drop.y += RAIN_SPEED_Y * drop.speed * dt;
    if (drop.y > canvas.height + 20) { drop.y = -20 - Math.random() * 100; drop.x = Math.random() * (canvas.width + 400) - 200; }
    if (drop.x > canvas.width + 200) { drop.x = -200; drop.y = Math.random() * canvas.height; }
  }

  // Lightning warnings
  thunderTimer -= dt;
  if (thunderTimer <= 0) {
    const margin = 100;
    lightningWarnings.push({
      x: margin + Math.random() * (canvas.width - margin * 2),
      y: margin + Math.random() * (canvas.height - margin * 2),
      radius: LIGHTNING_RADIUS,
      timer: LIGHTNING_WARN_TIME,
      maxTimer: LIGHTNING_WARN_TIME,
    });
    thunderTimer = THUNDER_MIN + Math.random() * (THUNDER_MAX - THUNDER_MIN);
  }
  for (let i = lightningWarnings.length - 1; i >= 0; i--) {
    const w = lightningWarnings[i];
    w.timer -= dt;
    if (w.timer <= 0) {
      const bolts = [];
      const boltCount = 3 + Math.floor(Math.random() * 3);
      for (let b = 0; b < boltCount; b++) {
        const ox = (Math.random() - 0.5) * w.radius * 0.8;
        const oy = (Math.random() - 0.5) * w.radius * 0.8;
        bolts.push(generateBolt(w.x + ox, w.y + oy));
      }
      lightningStrikes.push({ x: w.x, y: w.y, radius: w.radius, life: 1.0, maxLife: 1.0, bolts: bolts });
      const pdx = w.x - player.x, pdy = w.y - player.y;
      if (pdx * pdx + pdy * pdy < w.radius * w.radius && player.invincible <= 0 && playerShield <= 0) {
        if (damagePlayer(LIGHTNING_DAMAGE, 1.5, { shake: 15, shakeDur: 0.5, blood: 15, label: `-${LIGHTNING_DAMAGE} HP`, color: '#88ccff', fontSize: 28, textOffY: 30, sound: 'none' })) return true;
      }
      screenFlash = 1.0;
      triggerShake(10, 0.3);
      playLightningCrack();
      setTimeout(() => playThunderSound(), 300 + Math.random() * 700);
      lightningWarnings.splice(i, 1);
    }
  }
  for (let i = lightningStrikes.length - 1; i >= 0; i--) {
    lightningStrikes[i].life -= dt;
    if (lightningStrikes[i].life <= 0) {
      const s = lightningStrikes[i];
      lightningFires.push({ x: s.x, y: s.y, radius: s.radius, life: LIGHTNING_FIRE_DURATION, maxLife: LIGHTNING_FIRE_DURATION, dmgTimer: 0 });
      lightningStrikes.splice(i, 1);
    }
  }
  // Fire pools - damage player inside
  for (let i = lightningFires.length - 1; i >= 0; i--) {
    const f = lightningFires[i];
    f.life -= dt;
    if (f.life <= 0) { lightningFires.splice(i, 1); continue; }
    f.dmgTimer -= dt;
    if (f.dmgTimer <= 0) {
      f.dmgTimer = 1.0;
      const pdx = f.x - player.x, pdy = f.y - player.y;
      if (pdx * pdx + pdy * pdy < f.radius * f.radius && player.invincible <= 0 && playerShield <= 0) {
        if (damagePlayer(LIGHTNING_FIRE_DPS, 0.5, { blood: 8, label: `-${LIGHTNING_FIRE_DPS} HP`, color: '#ff6622', fontSize: 22, textOffY: 30, sound: 'none' })) return true;
      }
    }
  }
  if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - dt * 3);

  return false;
}

function updateBossAI(dt) {
  if (!finalBoss || finalBoss.hp <= 0) return;

  // Teleport check: every 250 HP lost
  if (finalBoss.hp <= bossLastTeleportHP - 250) {
    bossLastTeleportHP -= 250;
    const oldX = finalBoss.x, oldY = finalBoss.y;
    bossTeleportAOEs.push({
      x: oldX, y: oldY,
      radius: 200,
      life: 2.5, maxLife: 2.5,
      playerHit: false,
    });
    const margin = 200;
    finalBoss.x = margin + Math.random() * (canvas.width - margin * 2);
    finalBoss.y = margin + Math.random() * (canvas.height - margin * 2);
    triggerShake(12, 0.5);
    playBossTeleportSound();
    spawnFloatingText(finalBoss.x, finalBoss.y - 100, 'TELEPORT!', '#cc44ff', 28);
    spawnFloatingText(oldX, oldY - 60, 'FIRE!', '#ff4400', 24);
    for (let p = 0; p < 30; p++) {
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 5;
      particles.push({
        x: oldX + Math.cos(a) * 20, y: oldY + Math.sin(a) * 20,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
        life: 0.8 + Math.random() * 0.5, maxLife: 1.3,
        color: ['#ff4400','#ff8800','#ffcc00','#ff2200'][Math.floor(Math.random()*4)],
        size: 3 + Math.random() * 4,
      });
    }
    for (let p = 0; p < 15; p++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1 + Math.random() * 3;
      particles.push({
        x: finalBoss.x + Math.cos(a) * 30, y: finalBoss.y + Math.sin(a) * 30,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.5 + Math.random() * 0.3, maxLife: 0.8,
        color: ['#aa44ff','#cc66ff','#8822cc'][Math.floor(Math.random()*3)],
        size: 3 + Math.random() * 3,
      });
    }
  }

  // Phase check
  if (finalBoss.hp <= 500 && bossPhase === 1) {
    bossPhase = 2;
    triggerShake(15, 1.0);
    playBossRoar();
    waveAnnounceText = 'PHASE 2 - ENRAGED!';
    waveAnnounceTimer = 2.0;
    spawnFloatingText(finalBoss.x, finalBoss.y - 100, 'ENRAGED!', '#ff2200', 32);
  }

  // Ground slam (both phases)
  bossAttackTimer -= dt;
  if (bossAttackTimer <= 0) {
    bossAttackTimer = bossPhase === 2 ? BOSS_SLAM_COOLDOWN * 0.6 : BOSS_SLAM_COOLDOWN;
    bossShockwaves.push({
      x: finalBoss.x, y: finalBoss.y,
      radius: 0, maxRadius: 350, speed: 400,
      life: 1.0, maxLife: 1.0,
    });
    triggerShake(8, 0.3);
    playBombSound();
  }

  // Summon ring of demons (both phases)
  bossSummonTimer -= dt;
  if (bossSummonTimer <= 0) {
    bossSummonTimer = bossPhase === 2 ? BOSS_SUMMON_COOLDOWN * 0.7 : BOSS_SUMMON_COOLDOWN;
    const count = bossPhase === 2 ? 12 : 8;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      const dist = 200;
      const sx = finalBoss.x + Math.cos(a) * dist;
      const sy = finalBoss.y + Math.sin(a) * dist;
      const typeName = bossPhase === 2 ? (Math.random() > 0.5 ? 'yellow' : 'red') : 'red';
      const typeData = DEMON_TYPES[typeName];
      const diffSpeedMult = activeDifficulty ? activeDifficulty.speedMult : 1;
      demons.push({
        x: sx, y: sy,
        speed: DEMON_BASE_SPEED * diffSpeedMult * (0.8 + Math.random() * 0.5),
        radius: 14 + Math.random() * 4,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 2 + Math.random() * 3,
        limbPhase: Math.random() * Math.PI * 2,
        type: typeName, hp: 20, maxHp: 20,
      });
    }
    spawnFloatingText(finalBoss.x, finalBoss.y - 60, 'SUMMON!', '#ff6644', 24);
  }

  // Homing fireballs (phase 2 only)
  if (bossPhase === 2) {
    if (!finalBoss._fireballTimer) finalBoss._fireballTimer = BOSS_FIREBALL_COOLDOWN;
    finalBoss._fireballTimer -= dt;
    if (finalBoss._fireballTimer <= 0) {
      finalBoss._fireballTimer = BOSS_FIREBALL_COOLDOWN;
      const angle = Math.atan2(player.y - finalBoss.y, player.x - finalBoss.x);
      bossFireballs.push({
        x: finalBoss.x, y: finalBoss.y,
        vx: Math.cos(angle) * BOSS_FIREBALL_SPEED,
        vy: Math.sin(angle) * BOSS_FIREBALL_SPEED,
        radius: 14, life: 5.0,
      });
      for (const offset of [-0.3, 0.3]) {
        bossFireballs.push({
          x: finalBoss.x, y: finalBoss.y,
          vx: Math.cos(angle + offset) * BOSS_FIREBALL_SPEED * 0.85,
          vy: Math.sin(angle + offset) * BOSS_FIREBALL_SPEED * 0.85,
          radius: 10, life: 4.0,
        });
      }
    }
  }
}

function updateMiniBossAI(dt) {
  if (!miniDemonLord || miniDemonLord.hp <= 0) return;

  // Phase 2 check: enraged at half HP
  if (miniDemonLord.hp <= miniDemonLord.maxHp / 2 && miniDemonLordPhase === 1) {
    miniDemonLordPhase = 2;
    triggerShake(15, 1.0);
    playBossRoar();
    waveAnnounceText = 'MINI-DEMON LORD ENRAGED!';
    waveAnnounceTimer = 2.0;
    spawnFloatingText(miniDemonLord.x, miniDemonLord.y - miniDemonLord.radius, 'ENRAGED!', '#ff00ff', 32);
    miniDemonLordThrowTimer = MDL_THROW_COOLDOWN;
  }

  // Phase 2: throw demons at the player every 3 seconds
  if (miniDemonLordPhase === 2) {
    miniDemonLordThrowTimer -= dt;
    if (miniDemonLordThrowTimer <= 0) {
      miniDemonLordThrowTimer = MDL_THROW_COOLDOWN;
      const smallDemons = demons.filter(d => d !== miniDemonLord && d.type !== 'finalBoss' && d.type !== 'green' && d.type !== 'miniDemonLord');
      if (smallDemons.length > 0) {
        const victim = smallDemons[Math.floor(Math.random() * smallDemons.length)];
        const idx = demons.indexOf(victim);
        if (idx !== -1) demons.splice(idx, 1);
        const angle = Math.atan2(player.y - miniDemonLord.y, player.x - miniDemonLord.x);
        const speed = 600;
        thrownDemons.push({
          x: miniDemonLord.x, y: miniDemonLord.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: victim.radius || 16,
          type: victim.type,
          life: 3.0,
          rotation: 0,
        });
        spawnFloatingText(miniDemonLord.x, miniDemonLord.y - miniDemonLord.radius - 20, 'THROW!', '#ff66ff', 24);
        playBossRoar();
      } else {
        const throwTypes = ['red', 'pink', 'yellow'];
        const throwType = throwTypes[Math.floor(Math.random() * throwTypes.length)];
        const angle = Math.atan2(player.y - miniDemonLord.y, player.x - miniDemonLord.x);
        const speed = 600;
        thrownDemons.push({
          x: miniDemonLord.x, y: miniDemonLord.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 16,
          type: throwType,
          life: 3.0,
          rotation: 0,
        });
        spawnFloatingText(miniDemonLord.x, miniDemonLord.y - miniDemonLord.radius - 20, 'THROW!', '#ff66ff', 24);
        playBossRoar();
      }
    }
  }
}

// Returns true if boss was killed and game should end
function checkBossDeath() {
  if (finalBossSpawned && finalBoss && !finalBossDefeated) {
    if (finalBoss.hp <= 0 || !demons.includes(finalBoss)) {
      finalBossDefeated = true;
      finalBoss = null;
      bossShockwaves = [];
      bossFireballs = [];
      triggerShake(25, 2.0);
      playBossRoar();
      state = 'victory';
      stopMusic();
      return true;
    }
  }
  return false;
}

// ========================================
// MAIN UPDATE LOOP
// ========================================
function update(dt) {
  if (state !== 'playing') return;
  if (levelUpActive) return;

  timeRemaining -= dt;
  if (timeRemaining <= 0) { timeRemaining = 0; state = 'victory'; stopMusic(); return; }

  // --- Mini-Demon Lord Spawn (at 150s elapsed in a 5-min game) ---
  if (timeLimit === 300 && (timeLimit - timeRemaining) >= 150 && !miniDemonLordSpawned) {
    spawnMiniDemonLord();
  }

  // --- Final Boss Spawn (5-min game, last 60 seconds) ---
  if (timeLimit === 300 && timeRemaining <= 60 && !finalBossSpawned) {
    spawnFinalBoss();
  }

  // --- Mini-Demon Lord Entrance Timer ---
  if (miniDemonLordEntranceTimer > 0) {
    miniDemonLordEntranceTimer -= dt;
    if (bossPortal) {
      bossPortal.life -= dt;
      if (bossPortal.life <= 0) bossPortal = null;
    }
    return;
  }

  // --- Mini-Demon Lord Explosion (cosmetic only, spawns health powerups) ---
  if (miniDemonLordExplosion) {
    miniDemonLordExplosion.life -= dt;
    if (miniDemonLordExplosion.life <= 0) {
      miniDemonLordExplosion = null;
    }
  }

  // --- Boss Entrance Timer (freeze gameplay briefly) ---
  if (bossEntranceTimer > 0) {
    bossEntranceTimer -= dt;
    // Update portal during entrance
    if (bossPortal) {
      bossPortal.life -= dt;
      if (bossPortal.life <= 0) bossPortal = null;
    }
    return;
  }
  // Continue portal fade after entrance ends
  if (bossPortal) {
    bossPortal.life -= dt;
    if (bossPortal.life <= 0) bossPortal = null;
  }

  difficultyTimer += dt;
  if (difficultyTimer > 10) spawnInterval = Math.max(0.3, 1.5 - difficultyTimer * 0.02);

  // Player movement
  let dx = 0, dy = 0;
  if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
  if (dx || dy) {
    const len = Math.sqrt(dx*dx+dy*dy);
    dx /= len; dy /= len;
    player.x += dx * player.speed * dt;
    player.y += dy * player.speed * dt;
    player.angle = Math.atan2(dy, dx);
  }
  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
  player.hairPhase += dt * 4;

  if (player.invincible > 0) player.invincible -= dt;

  // Sword swing (constant, no cooldown period)
  if (player.swingAnim > 0) player.swingAnim -= dt;
  player.swingCooldown -= dt;
  const currentCooldown = SWORD_BASE_COOLDOWN / swingSpeedMult;
  if (player.swingCooldown <= 0) {
    player.swingCooldown = currentCooldown;
    player.swingAnim = SWORD_ANIM_DUR;
    playSwordSound();
    spawnSlashEffect(player.x, player.y, player.angle);

    // Sword hit detection
    for (let di = demons.length - 1; di >= 0; di--) {
      const d = demons[di];
      const ddx = d.x - player.x;
      const ddy = d.y - player.y;
      const dist = Math.sqrt(ddx*ddx + ddy*ddy);
      if (dist < SWORD_RANGE * swordRangeMult + d.radius) {
        const angleToD = Math.atan2(ddy, ddx);
        if (Math.abs(angleDiff(angleToD, player.angle)) < (SWORD_ARC * swordArcMult) / 2) {
          const dmg = (d.type === 'green' || d.type === 'miniDemonLord' || d.maxHp > 3) ? swordBossDamage : 1;
          hitDemon(di, dmg, { shake: 3, shakeDur: 0.08 });
        }
      }
    }
  }

  // Rockets (4 cardinal directions)
  player.rocketCooldown -= dt;
  if (player.rocketCooldown <= 0) {
    player.rocketCooldown = ROCKET_COOLDOWN;
    const dirs = [0, Math.PI/2, Math.PI, Math.PI*1.5];
    for (const dir of dirs) {
      rockets.push({
        x: player.x, y: player.y,
        vx: Math.cos(dir) * ROCKET_SPEED * rocketSpeedMult,
        vy: Math.sin(dir) * ROCKET_SPEED * rocketSpeedMult,
        radius: ROCKET_SIZE,
      });
    }
    playShootSound();
  }

  // Update rockets
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.x += r.vx * dt;
    r.y += r.vy * dt;
    if (r.x < -20 || r.x > canvas.width+20 || r.y < -20 || r.y > canvas.height+20) {
      rockets.splice(i, 1);
      continue;
    }
    let hit = false;
    for (let di = demons.length - 1; di >= 0; di--) {
      const d = demons[di];
      const ddx = r.x - d.x, ddy = r.y - d.y;
      if (ddx*ddx+ddy*ddy < (r.radius+d.radius)*(r.radius+d.radius)) {
        explosions.push({ x: r.x, y: r.y, life: EXPLOSION_DUR, maxLife: EXPLOSION_DUR });
        playExplosionSound();
        // AoE damage to all demons in explosion radius
        for (let aj = demons.length - 1; aj >= 0; aj--) {
          const ad = demons[aj];
          const adx = r.x - ad.x, ady = r.y - ad.y;
          const effExpR = EXPLOSION_RADIUS * explosionRadiusMult;
          if (adx*adx+ady*ady < effExpR*effExpR) {
            hitDemon(aj, 1, { color: '#cc88ff' });
          }
        }
        hit = true;
        if (rocketPiercing) { hit = false; }
        break;
      }
    }
    if (hit) rockets.splice(i, 1);
  }

  // Update explosions
  for (let i = explosions.length - 1; i >= 0; i--) {
    explosions[i].life -= dt;
    if (explosions[i].life <= 0) explosions.splice(i, 1);
  }

  // Update bomb explosions
  for (let i = bombExplosions.length - 1; i >= 0; i--) {
    bombExplosions[i].life -= dt;
    if (bombExplosions[i].life <= 0) bombExplosions.splice(i, 1);
  }

  // Bomb regen timers
  for (let i = bombRegenTimers.length - 1; i >= 0; i--) {
    bombRegenTimers[i] -= dt;
    if (bombRegenTimers[i] <= 0) {
      bombs = Math.min(bombs + 1, MAX_BOMBS);
      bombRegenTimers.splice(i, 1);
    }
  }

  // Bomb use cooldown
  if (bombCooldown > 0) bombCooldown -= dt;

  // Dash cooldown
  if (dashCooldown > 0) dashCooldown -= dt;

  // Fire trail update & damage
  for (let i = fireTrail.length - 1; i >= 0; i--) {
    const ft = fireTrail[i];
    ft.life -= dt;
    if (ft.life <= 0) { fireTrail.splice(i, 1); continue; }
    // Ember particles floating up
    if (Math.random() < 0.3) {
      particles.push({
        x: ft.x + (Math.random()-0.5) * ft.radius,
        y: ft.y + (Math.random()-0.5) * ft.radius,
        vx: (Math.random()-0.5) * 20,
        vy: -30 - Math.random() * 50,
        life: 0.4 + Math.random() * 0.4,
        maxLife: 0.4 + Math.random() * 0.4,
        color: Math.random() > 0.5 ? '#ffaa22' : '#ff6600',
        size: 1.5 + Math.random() * 2.5,
      });
    }
    // Damage demons touching the fire trail
    for (let di = demons.length - 1; di >= 0; di--) {
      const d = demons[di];
      const ddx = ft.x - d.x, ddy = ft.y - d.y;
      const distSq = ddx*ddx+ddy*ddy;
      if (distSq < (ft.radius+d.radius)*(ft.radius+d.radius)) {
        if (d.type === 'finalBoss' || d.type === 'miniDemonLord') {
          // Bosses are immune to dash damage
          spawnFloatingText(d.x, d.y - d.radius, 'IMMUNE', '#ff4444', 20);
        } else if (d.type === 'green') {
          // Knock green boss back halfway across the screen
          const dist = Math.sqrt(distSq) || 1;
          const knockDist = Math.max(canvas.width, canvas.height) * 0.5;
          d.x += (-ddx / dist) * knockDist;
          d.y += (-ddy / dist) * knockDist;
          d.x = Math.max(-50, Math.min(canvas.width + 50, d.x));
          d.y = Math.max(-50, Math.min(canvas.height + 50, d.y));
          spawnBlood(d.x, d.y, 15);
          playHitSound();
        } else {
          d.hp = 0;
          killDemon(di);
        }
      }
    }
  }

  // Health powerup spawning (when below 50% health)
  if (player.health < 50) {
    if (wasAbove50) {
      // First time dropping below 50% - spawn instantly
      wasAbove50 = false;
      spawnHealthPowerup();
      healthSpawnTimer = HEALTH_SPAWN_INTERVAL;
    } else {
      healthSpawnTimer -= dt;
      if (healthSpawnTimer <= 0) {
        spawnHealthPowerup();
        healthSpawnTimer = HEALTH_SPAWN_INTERVAL;
      }
    }
  } else {
    wasAbove50 = true;
  }

  // Health powerup bob & pickup
  for (const hp of healthPowerups) hp.bobPhase += dt * 3;
  for (let i = healthPowerups.length - 1; i >= 0; i--) {
    const hp = healthPowerups[i];
    const ddx = player.x - hp.x, ddy = player.y - hp.y;
    if (ddx*ddx+ddy*ddy < (player.radius+hp.radius)*(player.radius+hp.radius)) {
      player.health = Math.min(100, player.health + HEALTH_RESTORE);
      playPowerupSound();
      for (let p = 0; p < 10; p++) {
        const a = Math.random()*Math.PI*2, sp = 50+Math.random()*80;
        particles.push({ x:hp.x, y:hp.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
          life:0.3+Math.random()*0.3, maxLife:0.3+Math.random()*0.3,
          color:Math.random()>0.5?'#ffaa22':'#ffdd44', size:3+Math.random()*3 });
      }
      healthPowerups.splice(i, 1);
    }
  }

  // Wave system (paused during final boss fight)
  const bossAlive = finalBoss && finalBoss.hp > 0;
  if (!bossAlive) {
    waveTimer -= dt;
    if (waveActive) {
      if (waveTimer <= 0) { waveActive = false; waveTimer = WAVE_BREAK; }
      else {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnTimer = spawnInterval;
          const spawnCount = 2 * (activeDifficulty ? activeDifficulty.spawnMult : 1);
          for (let si = 0; si < spawnCount; si++) spawnDemon();
        }
      }
    } else {
      if (waveTimer <= 0) { waveActive = true; waveTimer = WAVE_DURATION; waveNumber++; waveAnnounceText = `WAVE ${waveNumber}`; waveAnnounceTimer = 2.5; }
    }
  }

  // Powerup bob & pickup (Ramen Gas Bomb)
  for (const pu of powerups) pu.bobPhase += dt * 3;
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    const ddx = player.x - pu.x, ddy = player.y - pu.y;
    if (ddx*ddx+ddy*ddy < (player.radius+pu.radius)*(player.radius+pu.radius)) {
      playBombSound();
      triggerShake(10, 0.5);
      // Spawn gas cloud covering 1/4 of the screen centered on powerup
      const cloudRadius = Math.sqrt(canvas.width * canvas.height / 4) / Math.sqrt(Math.PI);
      gasClouds.push({
        x: pu.x, y: pu.y,
        radius: cloudRadius,
        life: GAS_CLOUD_DURATION,
        maxLife: GAS_CLOUD_DURATION,
        dmgTimer: 0,
      });
      // Initial burst particles
      for (let p = 0; p < 30; p++) {
        const a = Math.random()*Math.PI*2, sp = 80+Math.random()*150;
        particles.push({ x:pu.x, y:pu.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
          life:0.5+Math.random()*0.4, maxLife:0.5+Math.random()*0.4,
          color:Math.random()>0.5?'#44ff44':'#88ff88', size:4+Math.random()*5 });
      }
      powerups.splice(i, 1);
    }
  }

  // Gas cloud update & damage
  for (let i = gasClouds.length - 1; i >= 0; i--) {
    const gc = gasClouds[i];
    gc.life -= dt;
    if (gc.life <= 0) { gasClouds.splice(i, 1); continue; }
    gc.dmgTimer -= dt;
    if (gc.dmgTimer <= 0) {
      gc.dmgTimer = GAS_CLOUD_DAMAGE_INTERVAL;
      for (let di = demons.length - 1; di >= 0; di--) {
        const d = demons[di];
        const gdx = gc.x - d.x, gdy = gc.y - d.y;
        if (gdx*gdx+gdy*gdy < (gc.radius+d.radius)*(gc.radius+d.radius)) {
          d.hp -= 5;
          spawnFloatingText(d.x, d.y - d.radius, 'TOXIC', '#44ff44', 14);
          if (d.hp <= 0) {
            killDemon(di);
          }
        }
      }
    }
  }

  updateDemonMovement(dt);
  if (updateBossProjectiles(dt)) return;

  updateBossAI(dt);
  updateMiniBossAI(dt);
  if (checkBossDeath()) return;

  // Random demon grunts
  demonGruntTimer -= dt;
  if (demonGruntTimer <= 0 && demons.length > 0) { demonGruntTimer = 1.5 + Math.random() * 3; playDemonGrunt(); }

  // Demon-Player collisions (demons survive, push apart)
  for (let di = demons.length - 1; di >= 0; di--) {
    const d = demons[di];
    const ddx = player.x - d.x, ddy = player.y - d.y;
    const distSq = ddx*ddx + ddy*ddy;
    const minDist = player.radius + d.radius;
    if (distSq < minDist * minDist) {
      if (player.invincible <= 0 && playerShield <= 0) {
        if (damagePlayer(1, 0.8 + invincibilityBonus, { blood: 6, label: '-1 HP', sound: 'none' })) return;
        playDemonGrunt();
      }
      // Push demon away from player
      const dist = Math.sqrt(distSq) || 1;
      const overlap = minDist - dist;
      const pushX = (-ddx / dist) * (overlap + 5);
      const pushY = (-ddy / dist) * (overlap + 5);
      d.x += pushX;
      d.y += pushY;
    }
  }

  // Update shield timer
  if (playerShield > 0) playerShield -= dt;

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = slashEffects.length - 1; i >= 0; i--) {
    slashEffects[i].life -= dt;
    if (slashEffects[i].life <= 0) slashEffects.splice(i, 1);
  }

  // --- Weather ---
  if (updateWeather(dt)) return;

  // --- Screen Shake Update ---
  if (shakeDuration > 0) {
    shakeDuration -= dt;
    shakeX = (Math.random() - 0.5) * shakeIntensity * 2;
    shakeY = (Math.random() - 0.5) * shakeIntensity * 2;
    shakeIntensity *= 0.92;
  } else {
    shakeX = 0; shakeY = 0;
  }

  // --- Combo Timer ---
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) comboCount = 0;
  }

  // --- Kill Flash ---
  if (killFlashTimer > 0) killFlashTimer -= dt;

  // --- Floating Texts ---
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.life -= dt;
    ft.y += ft.vy * dt;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  // --- Milestone Banner ---
  if (milestoneBannerTimer > 0) milestoneBannerTimer -= dt;

  // --- Wave Announcement ---
  if (waveAnnounceTimer > 0) waveAnnounceTimer -= dt;

  // --- Controls Legend ---
  if (controlsLegendTimer > 0) controlsLegendTimer -= dt;

}

// ========================================
// DRAW FUNCTIONS
// ========================================
function draw() {
  // Dirt field background
  ctx.fillStyle = '#6b5735';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Dirt texture variation
  ctx.fillStyle = '#7a6340';
  for (let x = 0; x < canvas.width; x += 30)
    for (let y = 0; y < canvas.height; y += 30) {
      const ox = ((x*7+y*13)%19), oy = ((x*3+y*11)%17);
      ctx.fillRect(x + ox, y + oy, 4 + (ox%3), 3 + (oy%3));
    }
  ctx.fillStyle = '#5e4c2e';
  for (let x = 10; x < canvas.width; x += 45)
    for (let y = 15; y < canvas.height; y += 45) {
      const ox = ((x*11+y*7)%23), oy = ((x*5+y*3)%19);
      ctx.fillRect(x + ox, y + oy, 3, 2);
    }
  // Grass tufts
  for (const g of grassTufts) {
    ctx.strokeStyle = g.color;
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    for (let b = 0; b < g.blades; b++) {
      const bx = g.x + (b - g.blades/2) * g.spread * 0.6;
      const lean = (b - g.blades/2) * 0.15;
      ctx.beginPath();
      ctx.moveTo(bx, g.y);
      ctx.quadraticCurveTo(bx + lean * g.height, g.y - g.height * 0.6, bx + lean * g.height * 1.5, g.y - g.height);
      ctx.stroke();
    }
  }

  if (state === 'menu') { drawMenu(); return; }
  if (state === 'leaderboard') { drawLeaderboardScreen(); return; }

  // Apply screen shake for gameplay states
  ctx.save();
  if (state === 'playing' || state === 'paused') ctx.translate(shakeX, shakeY);

  if (state === 'gameover') { drawGame(); drawMiniDemonLordExplosion(); drawGameOverScreen(); ctx.restore(); return; }
  if (state === 'victory') { drawGame(); drawVictoryScreen(); ctx.restore(); return; }
  if (state === 'nameentry') { drawGame(); drawNameEntry(); ctx.restore(); return; }
  if (state === 'paused') { drawGame(); drawHUD(); drawPauseScreen(); ctx.restore(); return; }
  drawGame();
  drawLightningWarnings();
  drawBossPortal();
  drawBossTeleportAOEs();
  drawBossShockwaves();
  drawBossFireballs();
  drawFloatingTexts();
  drawEdgeIndicators();
  drawRain();
  drawLightningStrikes();
  drawHUD();
  drawBossHPBar();
  drawMiniDemonLordHPBar();
  drawMiniDemonLordExplosion();
  drawComboDisplay();
  drawLowHealthFlash();
  drawControlsLegend();
  drawMilestoneBanner();
  drawWaveAnnouncement();
  drawBossEntrance();
  drawMiniDemonLordEntrance();
  if (levelUpActive) drawLevelUpUI();
  ctx.restore();
}

function drawGame() {
  // Slash effects
  for (const s of slashEffects) {
    const t = 1 - s.life / s.maxLife;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.angle);
    ctx.globalAlpha = 1 - t;
    ctx.strokeStyle = '#ccddff';
    ctx.lineWidth = 3 - t * 2;
    ctx.beginPath();
    ctx.arc(0, 0, SWORD_RANGE * swordRangeMult * (0.6 + t * 0.4), -SWORD_ARC*swordArcMult/2, SWORD_ARC*swordArcMult/2);
    ctx.stroke();
    ctx.globalAlpha = (1 - t) * 0.3;
    ctx.fillStyle = '#aaccff';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, SWORD_RANGE * swordRangeMult * (0.6 + t * 0.4), -SWORD_ARC*swordArcMult/2, SWORD_ARC*swordArcMult/2);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size/2, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Rockets
  for (const r of rockets) {
    const angle = Math.atan2(r.vy, r.vx);
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(angle);
    // Glow
    const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, 10);
    grd.addColorStop(0, 'rgba(180,100,255,0.4)');
    grd.addColorStop(1, 'rgba(180,100,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
    // Trail
    ctx.fillStyle = 'rgba(140,60,220,0.5)';
    ctx.beginPath();
    ctx.moveTo(-10, -3); ctx.lineTo(-4, 0); ctx.lineTo(-10, 3);
    ctx.closePath(); ctx.fill();
    // Bolt body
    ctx.fillStyle = '#cc88ff';
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(-4, -3); ctx.lineTo(-4, 3);
    ctx.closePath(); ctx.fill();
    // Bright core
    ctx.fillStyle = '#eeddff';
    ctx.beginPath();
    ctx.moveTo(6, 0); ctx.lineTo(-2, -1.5); ctx.lineTo(-2, 1.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Explosions
  for (const e of explosions) {
    const t = 1 - e.life / e.maxLife;
    const r = EXPLOSION_RADIUS * explosionRadiusMult * (0.3 + t * 0.7);
    ctx.save();
    ctx.globalAlpha = 1 - t;
    // Outer fireball
    const grd = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
    grd.addColorStop(0, '#ffeecc');
    grd.addColorStop(0.3, '#ff8833');
    grd.addColorStop(0.7, '#cc3300');
    grd.addColorStop(1, 'rgba(100,20,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Bomb explosions
  for (const be of bombExplosions) {
    const t = 1 - be.life / be.maxLife;
    const r = BOMB_RADIUS * (0.2 + t * 0.8);
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - t * 1.2);
    const grd = ctx.createRadialGradient(be.x, be.y, 0, be.x, be.y, r);
    grd.addColorStop(0, '#ffffee');
    grd.addColorStop(0.15, '#ffcc44');
    grd.addColorStop(0.4, '#ff6611');
    grd.addColorStop(0.7, '#cc2200');
    grd.addColorStop(1, 'rgba(80,10,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(be.x, be.y, r, 0, Math.PI*2); ctx.fill();
    // Inner bright flash
    if (t < 0.3) {
      ctx.globalAlpha = (0.3 - t) / 0.3 * 0.6;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(be.x, be.y, r * 0.3, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Fire trail
  for (const ft of fireTrail) {
    const t = 1 - ft.life / ft.maxLife;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - t);
    const grd = ctx.createRadialGradient(ft.x, ft.y, 0, ft.x, ft.y, ft.radius);
    grd.addColorStop(0, '#ffee66');
    grd.addColorStop(0.3, '#ff8822');
    grd.addColorStop(0.7, '#cc3300');
    grd.addColorStop(1, 'rgba(100,20,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(ft.x, ft.y, ft.radius * (1 - t * 0.3), 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Gas Clouds
  for (const gc of gasClouds) {
    const t = 1 - gc.life / gc.maxLife;
    const fadeIn = Math.min(1, gc.life / (gc.maxLife - 0.5));
    const fadeOut = gc.life < 1 ? gc.life : 1;
    const alpha = Math.min(fadeIn, fadeOut) * 0.45;
    ctx.save();
    ctx.globalAlpha = alpha;
    // Main cloud body
    const grd = ctx.createRadialGradient(gc.x, gc.y, 0, gc.x, gc.y, gc.radius);
    grd.addColorStop(0, 'rgba(30,200,30,0.6)');
    grd.addColorStop(0.4, 'rgba(40,180,40,0.4)');
    grd.addColorStop(0.7, 'rgba(50,150,30,0.2)');
    grd.addColorStop(1, 'rgba(60,120,30,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(gc.x, gc.y, gc.radius, 0, Math.PI*2); ctx.fill();
    // Swirling tendrils
    const time = performance.now() / 1000;
    for (let j = 0; j < 6; j++) {
      const angle = (j / 6) * Math.PI * 2 + time * 0.5;
      const dist = gc.radius * (0.3 + Math.sin(time * 2 + j) * 0.15);
      const tx = gc.x + Math.cos(angle) * dist;
      const ty = gc.y + Math.sin(angle) * dist;
      const tr = gc.radius * 0.35;
      const tg = ctx.createRadialGradient(tx, ty, 0, tx, ty, tr);
      tg.addColorStop(0, 'rgba(80,255,80,0.3)');
      tg.addColorStop(1, 'rgba(60,200,60,0)');
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.arc(tx, ty, tr, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Powerups
  for (const pu of powerups) drawPowerup(pu);

  // Health powerups
  for (const hp of healthPowerups) drawHealthPowerup(hp);

  // Demons
  for (const d of demons) drawDemon(d);

  // Thrown demons (spinning projectiles from Mini-Demon Lord)
  for (const td of thrownDemons) {
    const c = DEMON_TYPES[td.type] || DEMON_TYPES.red;
    ctx.save();
    ctx.translate(td.x, td.y);
    ctx.rotate(td.rotation);
    const s = td.radius / 16;
    // Body
    ctx.fillStyle = c.skin;
    ctx.beginPath();
    ctx.arc(0, 0, td.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = c.skinDark;
    ctx.lineWidth = 2;
    ctx.stroke();
    // Eyes (angry)
    ctx.fillStyle = c.eye;
    ctx.beginPath(); ctx.arc(-4*s, -4*s, 3*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4*s, -4*s, 3*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-4*s, -4*s, 1.5*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4*s, -4*s, 1.5*s, 0, Math.PI*2); ctx.fill();
    // Horns
    ctx.fillStyle = c.horn;
    ctx.beginPath(); ctx.moveTo(-6*s, -8*s); ctx.lineTo(-3*s, -14*s); ctx.lineTo(0, -8*s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6*s, -8*s); ctx.lineTo(3*s, -14*s); ctx.lineTo(0, -8*s); ctx.closePath(); ctx.fill();
    // Motion trail
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = c.skinLight;
    const trailAngle = Math.atan2(-td.vy, -td.vx);
    ctx.beginPath();
    ctx.moveTo(Math.cos(trailAngle - 0.3) * td.radius, Math.sin(trailAngle - 0.3) * td.radius);
    ctx.lineTo(Math.cos(trailAngle) * td.radius * 2.5, Math.sin(trailAngle) * td.radius * 2.5);
    ctx.lineTo(Math.cos(trailAngle + 0.3) * td.radius, Math.sin(trailAngle + 0.3) * td.radius);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Player
  drawRumi();
}

// --- Draw Rumi ---
function drawRumi() {
  const p = player;
  const flash = p.invincible > 0 && Math.sin(p.invincible * 30) > 0;
  ctx.save();
  ctx.translate(p.x, p.y);

  // --- Shield visual (when active) ---
  if (playerShield > 0) {
    const shieldPulse = 0.6 + Math.sin(performance.now() * 0.008) * 0.2;
    const shieldFade = Math.min(1, playerShield / 2); // fade out in last 2 seconds
    ctx.save();
    ctx.globalAlpha = shieldFade * shieldPulse;
    // Outer glow
    const grd = ctx.createRadialGradient(0, 0, 18, 0, 0, 34);
    grd.addColorStop(0, 'rgba(255,255,255,0)');
    grd.addColorStop(0.6, 'rgba(200,220,255,0.25)');
    grd.addColorStop(1, 'rgba(150,180,255,0.1)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, 34, 0, Math.PI * 2);
    ctx.fill();
    // Shield ring
    ctx.strokeStyle = `rgba(220,235,255,${0.7 * shieldFade})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.lineDashOffset = -performance.now() * 0.03;
    ctx.beginPath();
    ctx.arc(0, 0, 28, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    // Inner bright ring
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * shieldFade})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 24, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // --- Long purple braid (behind body) ---
  ctx.save();
  ctx.rotate(p.angle + Math.PI); // hair flows opposite to facing
  const hairWave = Math.sin(p.hairPhase) * 0.15;
  // Braid main body
  ctx.fillStyle = flash ? '#eeddff' : '#7733bb';
  ctx.beginPath();
  ctx.moveTo(-6, -3);
  ctx.quadraticCurveTo(5, -10 + Math.sin(p.hairPhase*1.3)*2.5, 15 + Math.sin(p.hairPhase)*3.5, -5);
  ctx.quadraticCurveTo(28 + Math.sin(p.hairPhase*0.7)*5, 0 + hairWave*10, 35 + Math.sin(p.hairPhase*1.1)*3.5, 2.5);
  ctx.quadraticCurveTo(28 + Math.sin(p.hairPhase*0.9)*3.5, 6, 15 + Math.sin(p.hairPhase*1.2)*2.5, 7.5);
  ctx.quadraticCurveTo(5, 10 + Math.sin(p.hairPhase*0.8)*2.5, -6, 3.5);
  ctx.closePath();
  ctx.fill();
  // Braid segments (cross-hatching for braided look)
  ctx.strokeStyle = flash ? '#ffffff' : '#9955dd';
  ctx.lineWidth = 1;
  for (let bi = 0; bi < 5; bi++) {
    const bx = 4 + bi * 6 + Math.sin(p.hairPhase + bi) * 1.5;
    ctx.beginPath();
    ctx.moveTo(bx, -4 + Math.sin(p.hairPhase + bi * 0.8) * 1.5);
    ctx.lineTo(bx + 3, 4 + Math.sin(p.hairPhase + bi * 0.8) * 1.5);
    ctx.stroke();
  }
  // Hair highlight
  ctx.fillStyle = flash ? '#ffffff' : '#aa66ee';
  ctx.beginPath();
  ctx.moveTo(-4, -1);
  ctx.quadraticCurveTo(8, -6, 18, -2.5);
  ctx.quadraticCurveTo(8, -1, -4, 0);
  ctx.closePath();
  ctx.fill();
  // Braid tie/ribbon at end
  ctx.fillStyle = flash ? '#ffeeee' : '#ff66aa';
  ctx.beginPath();
  ctx.arc(33 + Math.sin(p.hairPhase*1.1)*3, 1, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // --- Legs (behind body, dark indigo shorts + black combat boots) ---
  ctx.save();
  ctx.rotate(p.angle);
  const legSwing = Math.sin(p.hairPhase * 2) * 0.2;
  // Left leg
  ctx.save();
  ctx.rotate(legSwing);
  ctx.fillStyle = flash ? '#ccccdd' : '#1a1a3a'; // dark indigo shorts
  ctx.fillRect(-3, -9, 3.5, 6);
  ctx.fillStyle = flash ? '#aaaaaa' : '#1a1a1a'; // black boots
  ctx.fillRect(-3, -12, 3.5, 4);
  ctx.strokeStyle = flash ? '#ff8888' : '#cc2222'; // red stripe on boots
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(-2.5, -11); ctx.lineTo(-2.5, -9); ctx.stroke();
  ctx.restore();
  // Right leg
  ctx.save();
  ctx.rotate(-legSwing);
  ctx.fillStyle = flash ? '#ccccdd' : '#1a1a3a';
  ctx.fillRect(-3, 3, 3.5, 6);
  ctx.fillStyle = flash ? '#aaaaaa' : '#1a1a1a';
  ctx.fillRect(-3, 8, 3.5, 4);
  ctx.strokeStyle = flash ? '#ff8888' : '#cc2222';
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(-2.5, 9); ctx.lineTo(-2.5, 11); ctx.stroke();
  ctx.restore();
  ctx.restore();

  // --- Body (yellow bomber jacket + white crop top) ---
  ctx.save();
  ctx.rotate(p.angle);
  // Torso - yellow puffy bomber jacket
  ctx.fillStyle = flash ? '#ffffff' : '#e8c820';
  ctx.beginPath();
  ctx.ellipse(0, 0, 12.5, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = flash ? '#eeeeaa' : '#c8a810';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // White crop top visible at front
  ctx.fillStyle = flash ? '#ffffff' : '#f0ece4';
  ctx.beginPath();
  ctx.ellipse(4, 0, 5, 6, 0, -0.6, 0.6);
  ctx.fill();
  // Jacket collar/neckline
  ctx.strokeStyle = flash ? '#ffeeaa' : '#d4b020';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(5, 0, 6, -0.5, 0.5);
  ctx.stroke();
  // Hot pink belt
  ctx.strokeStyle = flash ? '#ffaacc' : '#ff3388';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-10, 0);
  ctx.lineTo(10, 0);
  ctx.stroke();
  // Pink tassel hanging from belt
  ctx.fillStyle = flash ? '#ffccdd' : '#ff88aa';
  ctx.fillRect(-8, -1, 1.5, 5);
  // Silver chain accessory
  ctx.strokeStyle = flash ? '#ffffff' : '#c0c0c0';
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  ctx.moveTo(0, -8);
  ctx.quadraticCurveTo(3, -10, 6, -8);
  ctx.stroke();
  ctx.restore();

  // --- Head ---
  // Skin (fair with beige-yellow undertone)
  ctx.fillStyle = flash ? '#ffffff' : '#f5dcc0';
  ctx.beginPath();
  ctx.arc(0, 0, 7.5, 0, Math.PI * 2);
  ctx.fill();

  // Hair on top of head (purple)
  ctx.fillStyle = flash ? '#eeddff' : '#7733bb';
  ctx.beginPath();
  ctx.arc(0, 0, 8, player.angle + Math.PI * 0.55, player.angle + Math.PI * 1.45);
  ctx.fill();

  // Front bangs (side-swept)
  ctx.save();
  ctx.rotate(p.angle);
  ctx.fillStyle = flash ? '#eeddff' : '#8844cc';
  ctx.beginPath();
  ctx.moveTo(4, -6);
  ctx.quadraticCurveTo(9, -3.5, 7.5, 0);
  ctx.lineTo(5, -2.5);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(4, 6);
  ctx.quadraticCurveTo(9, 3.5, 7.5, 0);
  ctx.lineTo(5, 2.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Eyes (brown, monolid style)
  ctx.save();
  ctx.rotate(p.angle);
  ctx.fillStyle = flash ? '#ffffff' : '#3a2210';
  ctx.beginPath(); ctx.ellipse(4, -2.5, 2, 1.3, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4, 2.5, 2, 1.3, 0, 0, Math.PI*2); ctx.fill();
  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(4.8, -2.8, 0.7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4.8, 2.2, 0.7, 0, Math.PI*2); ctx.fill();
  // Subtle eyeliner
  ctx.strokeStyle = flash ? '#dddddd' : '#2a1508';
  ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.arc(4, -2.5, 2.2, -0.3, Math.PI + 0.3); ctx.stroke();
  ctx.beginPath(); ctx.arc(4, 2.5, 2.2, -Math.PI - 0.3, 0.3); ctx.stroke();
  ctx.restore();

  // --- Sword ---
  ctx.save();
  ctx.rotate(p.angle);
  const swingOffset = p.swingAnim > 0 ? Math.sin((1 - p.swingAnim/SWORD_ANIM_DUR) * Math.PI) * 0.6 : 0;
  ctx.rotate(swingOffset);
  // Blade
  const swordLen = SWORD_RANGE * swordRangeMult;
  ctx.fillStyle = flash ? '#ffffff' : '#ddeeff';
  ctx.strokeStyle = '#8899bb';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(15, -2);
  ctx.lineTo(swordLen - 8, -1.2);
  ctx.lineTo(swordLen - 2, 0);
  ctx.lineTo(swordLen - 8, 1.2);
  ctx.lineTo(15, 2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Edge gleam
  ctx.strokeStyle = 'rgba(200,220,255,0.6)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(17, -0.5);
  ctx.lineTo(swordLen - 10, 0);
  ctx.stroke();
  // Guard
  ctx.fillStyle = '#ccaa44';
  ctx.fillRect(12, -5, 3.5, 10);
  // Grip
  ctx.fillStyle = '#5a3a2a';
  ctx.fillRect(6, -2.5, 7, 5);
  ctx.restore();

  ctx.restore();
}

// --- Draw Demon ---
function drawDemon(d) {
  const c = DEMON_TYPES[d.type];
  ctx.save();
  ctx.translate(d.x, d.y);
  const angle = Math.atan2(player.y - d.y, player.x - d.x);
  ctx.rotate(angle - Math.PI / 2);
  const s = d.radius / 16;
  const limbSwing = Math.sin(d.limbPhase) * 0.4;

  // --- Tail ---
  ctx.strokeStyle = c.skinDark;
  ctx.lineWidth = 2.5 * s;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 10 * s);
  ctx.quadraticCurveTo(-6*s + Math.sin(d.limbPhase)*3*s, 18*s, -4*s + Math.sin(d.limbPhase*1.3)*4*s, 24*s);
  ctx.stroke();
  // Tail tip (spade)
  ctx.fillStyle = c.skinDark;
  const tx = -4*s + Math.sin(d.limbPhase*1.3)*4*s;
  const ty = 24*s;
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx - 3*s, ty + 4*s);
  ctx.lineTo(tx, ty + 2*s);
  ctx.lineTo(tx + 3*s, ty + 4*s);
  ctx.closePath();
  ctx.fill();

  // --- Wings (small, bat-like) ---
  ctx.fillStyle = c.skinDark;
  ctx.globalAlpha = 0.7;
  // Left wing
  ctx.save();
  ctx.translate(-8*s, -2*s);
  ctx.rotate(-0.3 + Math.sin(d.limbPhase * 2) * 0.2);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-10*s, -6*s, -14*s, -2*s);
  ctx.quadraticCurveTo(-10*s, -1*s, -8*s, 2*s);
  ctx.quadraticCurveTo(-6*s, -2*s, -4*s, 2*s);
  ctx.lineTo(0, 0);
  ctx.fill();
  ctx.restore();
  // Right wing
  ctx.save();
  ctx.translate(8*s, -2*s);
  ctx.rotate(0.3 - Math.sin(d.limbPhase * 2) * 0.2);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(10*s, -6*s, 14*s, -2*s);
  ctx.quadraticCurveTo(10*s, -1*s, 8*s, 2*s);
  ctx.quadraticCurveTo(6*s, -2*s, 4*s, 2*s);
  ctx.lineTo(0, 0);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;

  // --- Legs ---
  ctx.strokeStyle = c.skinDark;
  ctx.lineWidth = 4 * s;
  ctx.lineCap = 'round';
  ctx.save();
  ctx.translate(-5*s, 8*s); ctx.rotate(limbSwing);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, 12*s); ctx.stroke();
  ctx.fillStyle = c.skinDark;
  ctx.beginPath(); ctx.ellipse(0, 13*s, 3*s, 2*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(5*s, 8*s); ctx.rotate(-limbSwing);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, 12*s); ctx.stroke();
  ctx.fillStyle = c.skinDark;
  ctx.beginPath(); ctx.ellipse(0, 13*s, 3*s, 2*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // --- Torso ---
  ctx.fillStyle = c.shirt;
  ctx.beginPath();
  ctx.moveTo(-8*s, -4*s); ctx.lineTo(8*s, -4*s); ctx.lineTo(7*s, 10*s);
  ctx.lineTo(3*s, 12*s); ctx.lineTo(-3*s, 11*s); ctx.lineTo(-7*s, 10*s);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = c.shirtDark; ctx.lineWidth = 1; ctx.stroke();

  // --- Arms with claws ---
  ctx.strokeStyle = c.skinLight; ctx.lineWidth = 4*s; ctx.lineCap = 'round';
  ctx.save();
  ctx.translate(-8*s, -1*s); ctx.rotate(-0.6 + limbSwing*0.3);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-4*s,-10*s); ctx.stroke();
  ctx.strokeStyle = c.skin; ctx.lineWidth = 2*s;
  ctx.beginPath(); ctx.moveTo(-4*s,-10*s); ctx.lineTo(-7*s,-14*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4*s,-10*s); ctx.lineTo(-3*s,-14*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4*s,-10*s); ctx.lineTo(-8*s,-11*s); ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.translate(8*s, -1*s); ctx.rotate(0.6 - limbSwing*0.3);
  ctx.strokeStyle = c.skinLight; ctx.lineWidth = 4*s;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(4*s,-10*s); ctx.stroke();
  ctx.strokeStyle = c.skin; ctx.lineWidth = 2*s;
  ctx.beginPath(); ctx.moveTo(4*s,-10*s); ctx.lineTo(7*s,-14*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4*s,-10*s); ctx.lineTo(3*s,-14*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4*s,-10*s); ctx.lineTo(8*s,-11*s); ctx.stroke();
  ctx.restore();

  // --- Head ---
  ctx.fillStyle = c.skin;
  ctx.beginPath(); ctx.ellipse(0, -9*s, 7*s, 8*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = c.skinDark; ctx.lineWidth = 1.5; ctx.stroke();

  // --- Horns ---
  ctx.fillStyle = c.horn;
  ctx.strokeStyle = c.skinDark;
  ctx.lineWidth = 1;
  // Left horn
  ctx.beginPath();
  ctx.moveTo(-4*s, -15*s);
  ctx.lineTo(-8*s, -24*s);
  ctx.lineTo(-2*s, -17*s);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Right horn
  ctx.beginPath();
  ctx.moveTo(4*s, -15*s);
  ctx.lineTo(8*s, -24*s);
  ctx.lineTo(2*s, -17*s);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Cheeks
  ctx.fillStyle = c.cheek;
  ctx.beginPath(); ctx.ellipse(-4*s, -6*s, 2*s, 3*s, -0.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4*s, -6*s, 2*s, 3*s, 0.2, 0, Math.PI*2); ctx.fill();

  // Eyes
  ctx.fillStyle = c.eye;
  ctx.shadowColor = c.eyeGlow; ctx.shadowBlur = 8*s;
  ctx.beginPath(); ctx.ellipse(-3*s, -10*s, 2.5*s, 2*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3*s, -10*s, 2.5*s, 2*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#110000'; ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.arc(-3*s,-10*s,0.8*s,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3*s,-10*s,0.8*s,0,Math.PI*2); ctx.fill();

  // Mouth - fanged
  ctx.fillStyle = '#110000';
  ctx.beginPath();
  ctx.moveTo(-4*s,-4*s); ctx.lineTo(-2*s,-2.5*s); ctx.lineTo(0,-4*s);
  ctx.lineTo(2*s,-2.5*s); ctx.lineTo(4*s,-4*s); ctx.lineTo(3.5*s,-2*s);
  ctx.lineTo(-3.5*s,-2*s);
  ctx.closePath(); ctx.fill();
  // Fangs
  ctx.fillStyle = '#eeeecc';
  ctx.beginPath();
  ctx.moveTo(-3*s,-4*s); ctx.lineTo(-2.5*s,-1.5*s); ctx.lineTo(-2*s,-4*s);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(3*s,-4*s); ctx.lineTo(2.5*s,-1.5*s); ctx.lineTo(2*s,-4*s);
  ctx.fill();

  ctx.restore();

  // HP bar for multi-hit
  if (d.maxHp > 1) {
    const isBoss = d.type === 'green';
    const barW = isBoss ? d.radius*1.5 : d.radius*2;
    const barH = isBoss ? 8 : 4;
    const barX = d.x - barW/2;
    const barY = d.y - d.radius - (isBoss ? 35 : 22);
    ctx.fillStyle = '#333'; ctx.fillRect(barX, barY, barW, barH);
    const hpPct = d.hp / d.maxHp;
    const barColor = d.type==='green'?'#33cc33':d.type==='blue'?'#4488ff':'#dddd33';
    ctx.fillStyle = barColor; ctx.fillRect(barX, barY, barW*hpPct, barH);
    ctx.strokeStyle = '#000'; ctx.lineWidth = isBoss?1:0.5;
    ctx.strokeRect(barX, barY, barW, barH);
    if (isBoss) {
      ctx.fillStyle='#fff'; ctx.font='bold 8px monospace'; ctx.textAlign='center';
      ctx.fillText(`${d.hp}/${d.maxHp}`, d.x, barY-2);
    }
  }
}

// --- Draw Cup of Noodles Powerup ---
function drawPowerup(pu) {
  const bob = Math.sin(pu.bobPhase) * 5;
  const px = pu.x, py = pu.y + bob;
  const S = 2;
  const pulse = 0.85 + Math.sin(pu.bobPhase * 2) * 0.15;
  const ps = S * pulse;
  ctx.save();

  // Glow
  const grad = ctx.createRadialGradient(px, py, 0, px, py, 44*pulse);
  grad.addColorStop(0, 'rgba(255,180,50,0.35)');
  grad.addColorStop(1, 'rgba(255,180,50,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(px, py, 44*pulse, 0, Math.PI*2); ctx.fill();

  // Cup body (tapered - wider at top, narrower at bottom)
  ctx.fillStyle = '#ee3333';
  ctx.beginPath();
  ctx.moveTo(px - 14*ps, py - 8*ps);
  ctx.lineTo(px - 10*ps, py + 14*ps);
  ctx.lineTo(px + 10*ps, py + 14*ps);
  ctx.lineTo(px + 14*ps, py - 8*ps);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#bb1111'; ctx.lineWidth = 1.5;
  ctx.stroke();

  // Cup rim (top ellipse)
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.ellipse(px, py - 8*ps, 14*ps, 5*ps, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#cc2222'; ctx.lineWidth = 1.5;
  ctx.stroke();

  // White label band on cup
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(px - 13*ps, py - 2*ps);
  ctx.lineTo(px - 11.5*ps, py + 6*ps);
  ctx.lineTo(px + 11.5*ps, py + 6*ps);
  ctx.lineTo(px + 13*ps, py - 2*ps);
  ctx.closePath();
  ctx.fill();
  // Label text
  ctx.fillStyle = '#cc2222'; ctx.font = `bold ${Math.round(7*ps)}px monospace`; ctx.textAlign = 'center';
  ctx.fillText('CUP', px, py + 4*ps);

  // Noodle pile on top
  ctx.fillStyle = '#ffdd66';
  ctx.beginPath();
  ctx.ellipse(px, py - 9*ps, 11*ps, 5*ps, 0, Math.PI, Math.PI*2);
  ctx.fill();
  // Noodle squiggles
  ctx.strokeStyle = '#eecc33'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px - 8*ps, py - 10*ps);
  ctx.quadraticCurveTo(px - 4*ps, py - 16*ps, px, py - 10*ps);
  ctx.quadraticCurveTo(px + 4*ps, py - 4*ps, px + 8*ps, py - 10*ps);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px - 5*ps, py - 11*ps);
  ctx.quadraticCurveTo(px, py - 16*ps, px + 5*ps, py - 11*ps);
  ctx.stroke();

  // Chopstick 1 (left, angled)
  ctx.strokeStyle = '#ddb888'; ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px - 2*ps, py - 10*ps);
  ctx.lineTo(px - 12*ps, py - 30*ps);
  ctx.stroke();
  // Chopstick 2 (right, angled)
  ctx.beginPath();
  ctx.moveTo(px + 2*ps, py - 10*ps);
  ctx.lineTo(px + 8*ps, py - 32*ps);
  ctx.stroke();

  // Steam wisps
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.5;
  const st = pu.bobPhase;
  ctx.beginPath();
  ctx.moveTo(px - 4*ps, py - 14*ps - Math.sin(st)*2);
  ctx.quadraticCurveTo(px - 7*ps, py - 22*ps - Math.sin(st*1.2)*3, px - 3*ps, py - 28*ps);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px + 4*ps, py - 15*ps - Math.sin(st+1)*2);
  ctx.quadraticCurveTo(px + 7*ps, py - 23*ps - Math.sin(st*0.8+1)*3, px + 3*ps, py - 29*ps);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px, py - 13*ps - Math.sin(st+2)*2);
  ctx.quadraticCurveTo(px + 2*ps, py - 20*ps - Math.sin(st*1.1+2)*2, px - 1*ps, py - 27*ps);
  ctx.stroke();

  // Cup bottom edge
  ctx.fillStyle = '#cc2222';
  ctx.beginPath();
  ctx.ellipse(px, py + 14*ps, 10*ps, 3*ps, 0, 0, Math.PI);
  ctx.fill();

  ctx.restore();
}

// --- Draw Health Powerup (Blue Tiger Face) ---
function drawHealthPowerup(hp) {
  const bob = Math.sin(hp.bobPhase) * 4;
  const px = hp.x, py = hp.y + bob;
  ctx.save();

  // Glow
  const grad = ctx.createRadialGradient(px, py, 0, px, py, 28);
  grad.addColorStop(0, 'rgba(255,200,50,0.3)');
  grad.addColorStop(1, 'rgba(255,200,50,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(px, py, 28, 0, Math.PI*2); ctx.fill();

  // --- Capri-Sun Juice Pouch ---
  const w = 18, h = 24; // half-width and half-height of pouch

  // Metallic pouch body (slightly puffy/rounded rectangle)
  // Back crinkle shadow
  ctx.fillStyle = '#b0b0b8';
  ctx.beginPath();
  ctx.moveTo(px - w, py - h + 4);
  ctx.lineTo(px + w, py - h + 4);
  ctx.lineTo(px + w + 2, py + h - 2);
  ctx.quadraticCurveTo(px + w + 2, py + h + 2, px + w - 2, py + h + 2);
  ctx.lineTo(px - w + 2, py + h + 2);
  ctx.quadraticCurveTo(px - w - 2, py + h + 2, px - w - 2, py + h - 2);
  ctx.closePath();
  ctx.fill();

  // Main pouch body - metallic silver gradient
  const pouchGrad = ctx.createLinearGradient(px - w, py, px + w, py);
  pouchGrad.addColorStop(0, '#c8c8d0');
  pouchGrad.addColorStop(0.3, '#e8e8f0');
  pouchGrad.addColorStop(0.5, '#f5f5ff');
  pouchGrad.addColorStop(0.7, '#e0e0e8');
  pouchGrad.addColorStop(1, '#b8b8c0');
  ctx.fillStyle = pouchGrad;
  ctx.beginPath();
  ctx.moveTo(px - w, py - h + 3);
  ctx.lineTo(px + w, py - h + 3);
  ctx.lineTo(px + w + 1, py + h);
  ctx.quadraticCurveTo(px + w + 1, py + h + 3, px + w - 3, py + h + 3);
  ctx.lineTo(px - w + 3, py + h + 3);
  ctx.quadraticCurveTo(px - w - 1, py + h + 3, px - w - 1, py + h);
  ctx.closePath();
  ctx.fill();

  // Pouch outline
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Crinkle lines (metallic bag texture)
  ctx.strokeStyle = 'rgba(150,150,160,0.5)';
  ctx.lineWidth = 0.5;
  for (let c = 0; c < 4; c++) {
    const cx2 = px - w + 6 + c * 9;
    ctx.beginPath();
    ctx.moveTo(cx2, py - h + 6);
    ctx.lineTo(cx2 + (Math.sin(c*2)*2), py + h);
    ctx.stroke();
  }

  // Colorful label area (fruit design on front)
  const labelGrad = ctx.createLinearGradient(px, py - 8, px, py + 14);
  labelGrad.addColorStop(0, '#ff6622');
  labelGrad.addColorStop(0.5, '#ffaa00');
  labelGrad.addColorStop(1, '#ff4411');
  ctx.fillStyle = labelGrad;
  ctx.beginPath();
  ctx.moveTo(px - w + 3, py - 8);
  ctx.lineTo(px + w - 3, py - 8);
  ctx.lineTo(px + w - 3, py + 14);
  ctx.lineTo(px - w + 3, py + 14);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#cc3300';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Sun/fruit circle on label
  ctx.fillStyle = '#ffdd00';
  ctx.beginPath();
  ctx.arc(px, py + 2, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff8800';
  ctx.beginPath();
  ctx.arc(px, py + 2, 4, 0, Math.PI * 2);
  ctx.fill();

  // "JUICE" text on label
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 6px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('JUICE', px, py - 2);

  // Wavy "sun rays" around the fruit
  ctx.strokeStyle = '#ffee44';
  ctx.lineWidth = 1;
  for (let r = 0; r < 6; r++) {
    const a = r * Math.PI / 3 + hp.bobPhase * 0.3;
    ctx.beginPath();
    ctx.moveTo(px + Math.cos(a) * 5, py + 2 + Math.sin(a) * 5);
    ctx.lineTo(px + Math.cos(a) * 9, py + 2 + Math.sin(a) * 9);
    ctx.stroke();
  }

  // Top crimp/seal of pouch
  ctx.fillStyle = '#d0d0d8';
  ctx.fillRect(px - w + 1, py - h + 1, w * 2 - 2, 5);
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 0.5;
  // Zigzag seal line
  ctx.beginPath();
  ctx.moveTo(px - w + 2, py - h + 3);
  for (let z = 0; z < 12; z++) {
    ctx.lineTo(px - w + 4 + z * 3, py - h + (z % 2 === 0 ? 2 : 4));
  }
  ctx.stroke();

  // Straw sticking out of top
  ctx.strokeStyle = '#ffee00';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px + 4, py - h + 2);
  ctx.lineTo(px + 6, py - h - 10);
  ctx.stroke();
  // Straw stripe
  ctx.strokeStyle = '#ff6600';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px + 4.5, py - h);
  ctx.lineTo(px + 5.5, py - h - 6);
  ctx.stroke();
  // Bendy part of straw
  ctx.strokeStyle = '#ffee00';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(px + 6, py - h - 10);
  ctx.quadraticCurveTo(px + 7, py - h - 14, px + 10, py - h - 15);
  ctx.stroke();

  // +10 HP label below
  ctx.fillStyle = '#44ff44'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
  ctx.fillText('+3 HP', px, py + h + 14);

  ctx.restore();
}

function drawHUD() {
  // Health bar
  const hbX = 20, hbY = 16, hbW = 200, hbH = 24;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(hbX-2, hbY-2, hbW+4, hbH+4);
  ctx.fillStyle = '#333'; ctx.fillRect(hbX, hbY, hbW, hbH);
  const healthPct = player.health / 100;
  ctx.fillStyle = healthPct > 0.5 ? '#33cc33' : healthPct > 0.25 ? '#cccc33' : '#cc3333';
  ctx.fillRect(hbX, hbY, hbW * healthPct, hbH);
  ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1; ctx.strokeRect(hbX, hbY, hbW, hbH);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
  ctx.fillText(`HP ${player.health}`, hbX + hbW/2, hbY + 17);

  // Timer
  const mins = Math.floor(timeRemaining / 60);
  const secs = Math.floor(timeRemaining % 60);
  ctx.font = 'bold 28px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = timeRemaining < 10 ? '#ff4444' : '#ffffff';
  ctx.fillText(`${mins}:${secs.toString().padStart(2,'0')}`, canvas.width/2, 38);

  // Kills (with flash animation)
  ctx.font = 'bold 20px monospace'; ctx.textAlign = 'right';
  if (killFlashTimer > 0) {
    const flash = Math.sin(killFlashTimer * 20) > 0;
    ctx.fillStyle = flash ? '#ffffff' : '#ff8800';
    ctx.font = 'bold 24px monospace';
  } else {
    ctx.fillStyle = '#ff8800';
  }
  ctx.fillText(`KILLS: ${kills}`, canvas.width - 20, 35);

  // XP Bar
  const xpBarX = canvas.width - 220, xpBarY = 42, xpBarW = 200, xpBarH = 10;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(xpBarX, xpBarY, xpBarW, xpBarH);
  ctx.fillStyle = '#44ddff';
  ctx.fillRect(xpBarX, xpBarY, xpBarW * (playerXP / xpToNext), xpBarH);
  ctx.strokeStyle = '#668'; ctx.lineWidth = 1; ctx.strokeRect(xpBarX, xpBarY, xpBarW, xpBarH);
  ctx.fillStyle = '#88ccff'; ctx.font = '10px monospace'; ctx.textAlign = 'right';
  ctx.fillText(`Lv ${playerLevel}`, xpBarX - 5, xpBarY + 9);

  // Wave
  ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
  if (waveActive) {
    ctx.fillStyle = '#ff6666';
    ctx.fillText(`WAVE ${waveNumber}  [${Math.ceil(waveTimer)}s]`, canvas.width/2, 58);
  } else {
    ctx.fillStyle = '#66ff66';
    ctx.fillText(`BREAK  [${Math.ceil(waveTimer)}s]`, canvas.width/2, 58);
  }

  // Power level
  if (swingSpeedMult > 1) {
    ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = '#ffcc00';
    ctx.fillText(`POWER: x${Math.round(swingSpeedMult * 100) / 100}`, 20, 56);
  }

  // Bombs display
  const bombY = 70;
  ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = '#ff8844';
  ctx.fillText('BOMBS:', 20, bombY);
  for (let i = 0; i < MAX_BOMBS; i++) {
    const bx = 100 + i * 30;
    if (i < bombs) {
      // Active bomb icon
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(bx, bombY - 4, 10, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#444';
      ctx.beginPath(); ctx.arc(bx, bombY - 4, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff6622';
      ctx.beginPath(); ctx.arc(bx, bombY - 4, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffcc44';
      ctx.beginPath(); ctx.arc(bx, bombY - 4, 3, 0, Math.PI*2); ctx.fill();
    } else {
      // Empty slot
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(bx, bombY - 4, 10, 0, Math.PI*2); ctx.stroke();
      // Show regen timer if applicable
      const regenIdx = i - bombs;
      if (regenIdx < bombRegenTimers.length) {
        ctx.fillStyle = '#aaa'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
        ctx.fillText(`${Math.ceil(bombRegenTimers[regenIdx])}`, bx, bombY - 1);
        ctx.textAlign = 'left'; ctx.font = 'bold 14px monospace';
      }
    }
  }
  ctx.fillStyle = '#aaa'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
  ctx.fillText('[CTRL]', 100 + MAX_BOMBS * 30 + 5, bombY);
  if (bombCooldown > 0) {
    ctx.fillStyle = '#ff6644'; ctx.font = 'bold 11px monospace';
    ctx.fillText(`CD: ${Math.ceil(bombCooldown)}s`, 100 + MAX_BOMBS * 30 + 65, bombY);
  }

  // Dash display
  const dashY = bombY + 22;
  ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = '#44ccff';
  ctx.fillText('DASH:', 20, dashY);
  if (dashCooldown > 0) {
    ctx.fillStyle = '#ff6644';
    ctx.fillText(`${Math.ceil(dashCooldown)}s`, 85, dashY);
  } else {
    ctx.fillStyle = '#44ff44';
    ctx.fillText('READY', 85, dashY);
  }
  ctx.fillStyle = '#aaa'; ctx.font = '11px monospace';
  ctx.fillText('[SPACE]', 140, dashY);

  // Shield display
  if (playerShield > 0) {
    const shieldY = dashY + 22;
    ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = '#ddeeff';
    ctx.fillText('SHIELD:', 20, shieldY);
    ctx.fillStyle = '#88ccff';
    const barW = 80;
    const barH = 10;
    const fill = playerShield / 8;
    ctx.fillRect(95, shieldY - 10, barW * fill, barH);
    ctx.strokeStyle = '#667788';
    ctx.lineWidth = 1;
    ctx.strokeRect(95, shieldY - 10, barW, barH);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`${Math.ceil(playerShield)}s`, 95 + barW / 2, shieldY - 1);
    ctx.textAlign = 'left';
  }
}

// --- Floating Damage Numbers ---
function drawFloatingTexts() {
  for (const ft of floatingTexts) {
    const alpha = ft.life / ft.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = ft.color;
    ctx.font = `bold ${ft.size}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// --- Edge Indicators (arrows pointing to off-screen demons) ---
function drawEdgeIndicators() {
  const margin = 40;
  for (const d of demons) {
    if (d.x >= 0 && d.x <= canvas.width && d.y >= 0 && d.y <= canvas.height) continue;
    const angle = Math.atan2(d.y - player.y, d.x - player.x);
    const edgeX = Math.max(margin, Math.min(canvas.width - margin, player.x + Math.cos(angle) * 300));
    const edgeY = Math.max(margin, Math.min(canvas.height - margin, player.y + Math.sin(angle) * 300));
    ctx.save();
    ctx.translate(edgeX, edgeY);
    ctx.rotate(angle);
    ctx.fillStyle = d.type === 'green' ? '#44ff44' : '#ff4444';
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-6, -7);
    ctx.lineTo(-6, 7);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// --- Combo Display ---
function drawComboDisplay() {
  if (comboCount >= 3) {
    const pulse = 1 + Math.sin(performance.now() / 100) * 0.1;
    const size = Math.min(40, 18 + comboCount * 0.5) * pulse;
    ctx.save();
    ctx.fillStyle = comboCount >= 20 ? '#ff2222' : comboCount >= 10 ? '#ffaa00' : '#ffdd00';
    ctx.font = `bold ${Math.round(size)}px monospace`;
    ctx.textAlign = 'right';
    ctx.fillText(`COMBO x${comboCount}`, canvas.width - 20, 65);
    ctx.restore();
  }
}

// --- Low Health Screen Flash ---
function drawLowHealthFlash() {
  if (player.health <= 25 && player.health > 0) {
    const pulse = (Math.sin(performance.now() / 200) + 1) / 2;
    ctx.save();
    ctx.fillStyle = `rgba(255, 0, 0, ${0.06 + pulse * 0.08})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Red vignette edges
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width*0.3, canvas.width/2, canvas.height/2, canvas.width*0.7);
    grad.addColorStop(0, 'rgba(255,0,0,0)');
    grad.addColorStop(1, `rgba(255,0,0,${0.15 + pulse * 0.1})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }
}

// --- Controls Legend (first 10 seconds) ---
function drawControlsLegend() {
  if (controlsLegendTimer <= 0) return;
  const alpha = controlsLegendTimer < 2 ? controlsLegendTimer / 2 : 1;
  ctx.save();
  ctx.globalAlpha = alpha * 0.8;
  const cx = canvas.width / 2, y = canvas.height - 80;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(cx - 350, y - 20, 700, 50);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('WASD/Arrows = Move  |  Auto-Sword  |  Auto-Rockets  |  SPACE = Dash  |  CTRL = Bomb', cx, y + 8);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Milestone Banner ---
function drawMilestoneBanner() {
  if (milestoneBannerTimer <= 0) return;
  const alpha = milestoneBannerTimer < 0.5 ? milestoneBannerTimer / 0.5 : (milestoneBannerTimer > 2.5 ? (3.0 - milestoneBannerTimer) / 0.5 : 1);
  ctx.save();
  ctx.globalAlpha = Math.max(0, alpha);
  const scale = 1 + (milestoneBannerTimer > 2.5 ? (3.0 - milestoneBannerTimer) * 0.3 : 0);
  ctx.fillStyle = '#ffdd00';
  ctx.font = `bold ${Math.round(56 * scale)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(milestoneBanner, canvas.width / 2, canvas.height / 2 - 100);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Wave Announcement ---
function drawWaveAnnouncement() {
  if (waveAnnounceTimer <= 0) return;
  const alpha = waveAnnounceTimer < 0.5 ? waveAnnounceTimer / 0.5 : (waveAnnounceTimer > 2.0 ? (2.5 - waveAnnounceTimer) / 0.5 : 1);
  ctx.save();
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.fillStyle = '#ff6666';
  ctx.font = 'bold 64px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(waveAnnounceText, canvas.width / 2, canvas.height / 2 - 160);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Level-Up Choice UI ---
function drawLevelUpUI() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2, cy = canvas.height / 2;
  ctx.fillStyle = '#ffdd00';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`LEVEL UP! (Lv ${playerLevel})`, cx, cy - 140);

  ctx.fillStyle = '#aaa';
  ctx.font = 'bold 18px monospace';
  ctx.fillText('Choose an upgrade (Up/Down + Enter)', cx, cy - 100);

  for (let i = 0; i < levelUpChoices.length; i++) {
    const u = levelUpChoices[i];

    ctx.strokeRect(cx - 270, by + 5, 55, 55);

// --- Boss HP Bar (top of screen) ---
function drawBossHPBar() {
  if (!finalBoss || finalBoss.hp <= 0) return;
  const cx = canvas.width / 2;
  const barW = 600, barH = 20, barY = 80;
  ctx.save();
  // Dark background
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(cx - barW/2 - 4, barY - 4, barW + 8, barH + 8);
  // Bar background
  ctx.fillStyle = '#331111';
  ctx.fillRect(cx - barW/2, barY, barW, barH);
  // HP fill
  const hpPct = finalBoss.hp / finalBoss.maxHp;
  const barColor = bossPhase === 2 ? '#ff2200' : '#cc3300';
  ctx.fillStyle = barColor;
  ctx.fillRect(cx - barW/2, barY, barW * hpPct, barH);
